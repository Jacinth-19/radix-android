<script>(()=>{'use strict';
 window.RadixLogicUI=function({icon,esc,toast,manualCopy,onKmap,onSaveSession,onFeedback}){
  const L=window.RadixLogic,D=window.RadixDiagrams,C=L.catalog;
  let saved={};try{saved=JSON.parse(localStorage.getItem('radix-logic-v3')||'{}')||{};}catch(_){}
  const s={section:['gates','combinational','sequential'].includes(saved.section)?saved.section:'gates',gate:C.gates.some(g=>g.id===saved.gate)?saved.gate:'AND',width:[2,3,4].includes(saved.width)?saved.width:2,circuit:C.circuits.some(c=>c.id===saved.circuit)?saved.circuit:'full-adder',seq:C.sequential.some(c=>c.id===saved.seq)?saved.seq:'D_FF',page:0,expanded:false,output:null};
  const unary=()=>['NOT','BUFFER'].includes(s.gate);s.gateInputs=Array(unary()?1:s.width).fill(true);s.combInputs=Array(C.circuits.find(c=>c.id===s.circuit).inputs.length).fill(false);
  const undo=new window.RadixStudy.History();
  const snapshot=()=>({...window.RadixStudy.clone(s),savedTick:tick});
  const apply=v=>{tick=v.savedTick;delete v.savedTick;Object.assign(s,v);persist();};
  let active=false,tick=0;const cache=new Map();
  function persist(){try{localStorage.setItem('radix-logic-v3',JSON.stringify({section:s.section,gate:s.gate,width:s.width,circuit:s.circuit,seq:s.seq}));}catch(_){}}
  const spec=()=>C.sequential.find(c=>c.id===s.seq);
  function reset(){const c=spec();s.seqInputs=L.defaultInputs(c);s.memory=L.initial(c);tick=0;s.history=[{tick:0,clock:false,inputs:[...s.seqInputs],outputs:L.outputs(c,s.memory,s.seqInputs)}];}
  reset();
  function record(){s.history=[...s.history,{tick:++tick,clock:s.memory.clock,inputs:[...s.seqInputs],outputs:L.outputs(spec(),s.memory,s.seqInputs)}].slice(-12);}
  function setClock(clock){s.memory=L.update(spec(),s.memory,s.seqInputs,clock);record();}
  async function copy(text,successMessage='Complete truth/state table copied.'){let ok=false;try{await navigator.clipboard.writeText(text);ok=true;}catch(_){const t=document.createElement('textarea');t.value=text;Object.assign(t.style,{position:'fixed',opacity:'0',top:0,left:0});document.body.appendChild(t);t.select();try{ok=document.execCommand('copy');}catch(_){}t.remove();}if(ok)toast(successMessage);else manualCopy(text);}
  const tableText=(name,table)=>name+'\n'+table.headers.join('\t')+'\n'+table.rows.map(r=>r.join('\t')).join('\n');
  function table(){const key=s.section==='gates'?s.gate+'-'+s.gateInputs.length:s.section==='combinational'?s.circuit:s.seq;if(cache.has(key))return cache.get(key);let headers,rows,total,rowAt=null;
   if(s.section==='gates'){const n=s.gateInputs.length;headers=Array.from({length:n},(_,i)=>String.fromCharCode(65+i)).concat('Y');rows=Array.from({length:1<<n},(_,c)=>{const i=L.bits(c,n);return i.map(Number).concat(Number(L.gate(s.gate,i)));});total=rows.length;}
   else if(s.section==='combinational'){const c=C.circuits.find(c=>c.id===s.circuit);headers=c.inputs.concat(Object.keys(c.outputs));total=1<<c.inputs.length;rowAt=code=>{const i=L.bits(code,c.inputs.length);return i.map(Number).concat(Object.values(L.evaluate(c,i).outputs).map(Number));};if(total<=4096)rows=Array.from({length:total},(_,code)=>rowAt(code));else rows=null;}
   else{const c=spec();headers=c.inputs.concat(['Q(now)','Q(next)','Status']);rows=L.nextRows(c).map(r=>r.inputs.map(Number).concat([L.binary(r.before,c.width),L.binary(r.after,c.width),r.forbidden?'forbidden':'valid']));total=rows.length;}
   const t={headers,rows,total,rowAt,paged:rows===null};cache.set(key,t);return t;
  }
  function pageRows(t,page){if(t.rows)return t.rows.slice(page*16,page*16+16);const start=page*16;return Array.from({length:Math.max(0,Math.min(16,t.total-start))},(_,i)=>t.rowAt(start+i));}
  function inputButtons(names,values){return `<div class="logic-inputs" id="logic-inputs" role="group" aria-label="Toggle circuit inputs">${names.map((name,i)=>`<button class="logic-bit ${values[i]?'on':''}" data-logic="input" data-index="${i}" aria-pressed="${values[i]}" aria-label="Input ${esc(name)}, ${Number(values[i])}. Tap to toggle"><span>${esc(name)}</span><strong>${Number(values[i])}</strong></button>`).join('')}</div>`;}
  function outputTags(names,values){return `<div class="logic-outputs" id="logic-outputs" aria-live="polite">${names.map((name,i)=>`<div><span>${esc(name)}</span><strong class="${values[i]===null?'unknown':''}">${values[i]===null?'X':values[i]}</strong></div>`).join('')}</div>`;}
  function renderLogic(container){active=true;document.body.classList.remove('is-editing');persist();container.innerHTML=`<section class="hero logic-hero"><div><p class="eyebrow">THE DIGITAL LOGIC STUDIO</p><h1>Small circuits.<br><span class="accent">Big ideas.</span></h1><p class="hero-copy">Tap an input. Follow a wire. Understand the output.</p></div><div class="student-badge mono">0 → 1<span>LITTLE AHA MOMENTS</span></div></section><div class="logic-tabs" id="logic-tabs" role="group" aria-label="Learning section">${[['gates','Gates'],['combinational','Combinational'],['sequential','Sequential']].map(([key,label])=>`<button data-logic="section" data-section="${key}" class="${s.section===key?'selected':''}" aria-pressed="${s.section===key}">${label}</button>`).join('')}</div><div class="logic-picker" id="logic-choice"><label for="logic-choice-select">${s.section==='gates'?'Choose a gate':s.section==='combinational'?'Choose a combinational circuit':'Choose a sequential circuit'}</label><select id="logic-choice-select">${(s.section==='gates'?C.gates:s.section==='combinational'?C.circuits:C.sequential).map(c=>`<option value="${c.id}" ${c.id===(s.section==='gates'?s.gate:s.section==='combinational'?s.circuit:s.seq)?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div class="study-history" id="logic-history"><button data-logic="undo">↶ Undo</button><button data-logic="redo">↷ Redo</button><button data-logic="save-session">Save session</button></div><div id="logic-stage"></div><p class="logic-model-note">Ideal digital models only. No analog voltage, propagation delay, real-time clock, setup/hold violations or metastability simulation.</p>`;update();}
  function update(){if(!active)return;document.querySelector('[data-logic="undo"]').disabled=!undo.canUndo;document.querySelector('[data-logic="redo"]').disabled=!undo.canRedo;const t=table(),rowCount=t.total,pages=Math.ceil(rowCount/16);s.page=Math.max(0,Math.min(s.page,pages-1));const shownRows=pageRows(t,s.page);let names,values,outputs,outNames,diagram,description,formula,lesson,controls='',hint='',current=-1,extra='';
   if(s.section==='gates'){const g=C.gates.find(g=>g.id===s.gate),n=s.gateInputs.length;names=Array.from({length:n},(_,i)=>String.fromCharCode(65+i));values=s.gateInputs;outputs=[Number(L.gate(s.gate,values))];outNames=['Y'];description=g.description;formula=[n<=2?g.formula:['XOR','XNOR'].includes(s.gate)?'Y = '+(s.gate==='XNOR'?'(':'')+names.join(' ⊕ ')+(s.gate==='XNOR'?')\'':''):`${s.gate} applied to ${n} inputs`];lesson=[g.lesson,'An output bubble means inversion; the extra input curve identifies XOR/XNOR.'];diagram=D.gate(s.gate,values,!!outputs[0]);current=L.code(values);controls=unary()?`<p class="logic-subnote">Exactly one input for ${s.gate}.</p>`:`<div class="arity-controls" aria-label="Gate input count">${[2,3,4].map(n=>`<button data-logic="arity" data-n="${n}" class="${n===s.width?'selected':''}">${n} inputs</button>`).join('')}</div>`;
   }else if(s.section==='combinational'){const c=C.circuits.find(c=>c.id===s.circuit);names=c.inputs;values=s.combInputs;const r=L.evaluate(c,values);outNames=Object.keys(c.outputs);outputs=Object.values(r.outputs).map(Number);description='No memory: outputs follow the current inputs.';formula=c.formula;lesson=c.lesson;diagram=D.circuit(c,r,s.expanded);current=L.code(values);controls=`<button class="quiet-btn primary diagram-mode" data-logic="diagram">${icon('grid')}${s.expanded?'Phone-friendly block view':'Explore gate-level view'}</button>`;if(s.expanded)hint='Swipe ↔ to follow all gates. Crossing wires connect only at dotted pin junctions.';if(c.inputs.length>=12)hint='Wide input bank: rotate your device to landscape for more room. The truth table is generated 16 rows per page.'+(s.expanded?' Swipe ↔ to follow the gate-level diagram.':'');
   }else{const c=spec();names=c.inputs;values=s.seqInputs;outputs=L.outputs(c,s.memory,values);outNames=c.width===1?['Q',"Q'"]:Array.from({length:c.width},(_,i)=>'Q'+(c.width-1-i));description=c.clocked?'EDGE-TRIGGERED · ↑CLK':'LEVEL-SENSITIVE · NO CLOCK';formula=[c.rule];lesson=c.lesson;diagram=D.sequential(c,s.memory,values,outputs,s.expanded);current=s.memory.bits===null?-1:L.code(values)*(1<<c.width)+s.memory.bits;
    controls=c.clocked?`<div class="clock-controls" id="logic-clock"><div class="mono">CLK = ${Number(s.memory.clock)} <span>· memory ${L.binary(s.memory.bits,c.width)}</span></div><div><button data-logic="rise" ${s.memory.clock?'disabled':''}>↑ Rise</button><button data-logic="fall" ${!s.memory.clock?'disabled':''}>↓ Fall</button><button data-logic="pulse" class="pulse">Pulse${icon('arrow')}</button></div></div>`:'';
    if(['SR_NOR','SR_NAND'].includes(c.id))controls+=`<button class="quiet-btn primary diagram-mode" data-logic="diagram">${s.expanded?'Block view':'See cross-coupled gates'}</button><button class="custom-btn" data-logic="release">Release both to hold</button><p class="logic-subnote">Models simultaneous release. Changing only one input first can recover a known set/reset state.</p>`;
    if(s.memory.bits===null)extra=`<p class="logic-error" role="status">${!c.clocked&&L.forbidden(c,values)?'Forbidden inputs force equal physical outputs. Stored memory is indeterminate; a valid set/reset recovers it.':'Stored memory is indeterminate (X). Capture a known D or use a valid set/reset to recover.'}</p>`;
    else if(c.clocked&&L.forbidden(c,values))extra='<p class="logic-error">This SR input combination will be forbidden if captured on the next rising edge.</p>';
    extra+=`<button class="quiet-btn primary" data-logic="reset">${icon('swap')}Initialize simulation</button><p class="logic-subnote">Initialization chooses a known teaching state. It does not model real hardware power-up.</p>`;
   }
   const tableHTML=`<section class="logic-table-card" id="logic-table"><div class="label-row"><h2>${s.section==='sequential'?'Next-state table':'Truth table'}</h2><span class="base-label">${rowCount.toLocaleString()} ROWS${pages>1?' · 16 PER PAGE':''}</span></div>${s.section==='sequential'?`<p class="logic-subnote">${spec().clocked?'Q(next) applies only on a rising edge; at other times Q holds.':'Level-sensitive: enabled inputs can update Q immediately.'}</p>`:''}<div class="logic-table-pan"><table class="truth-table"><thead><tr>${t.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${shownRows.map((r,i)=>`<tr class="${current===s.page*16+i?'current':''}" ${current===s.page*16+i?'aria-current="true"':''}>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${pages>1?`<div class="table-pager"><button class="quiet-btn" data-logic="previous" ${s.page===0?'disabled':''}>← Previous</button><span class="mono">${s.page+1}/${pages}</span><button class="quiet-btn" data-logic="next" ${s.page===pages-1?'disabled':''}>Next →</button></div>`:''}${current>=0&&Math.floor(current/16)!==s.page?'<button class="quiet-btn primary" data-logic="current">Show current row</button>':''}<button class="quiet-btn primary copy-table" data-logic="copy">${icon('copy')}${pages>1?'Copy visible page':'Copy complete table'}</button>${kmapTools(names,outNames,t)}</section>`;
   const timing=s.section==='sequential'?`<section class="logic-table-card timing-card" id="logic-timing"><h2>See memory over time</h2><p class="logic-subnote">Each column is an action sample, not elapsed time. Swipe for your latest 12 samples. X is unknown.</p><div class="diagram-pan expanded">${D.timing(spec(),s.history)}</div></section>`:'';
   document.getElementById('logic-stage').innerHTML=`<div class="logic-workspace"><section class="logic-board"><p class="logic-description">${esc(description)}</p>${s.section==='gates'?controls:''}${inputButtons(names,values)}${outputTags(outNames,outputs)}${s.section!=='gates'?controls:''}<div class="diagram-pan ${s.expanded?'expanded':''}" id="logic-diagram">${diagram}</div>${hint?`<p class="logic-subnote">${hint}</p>`:''}${extra}<div class="logic-formula mono">${formula.map(x=>`<div>${esc(x)}</div>`).join('')}</div><div class="logic-explanation">${lesson.map(x=>`<p>${esc(x)}</p>`).join('')}</div></section><aside class="logic-insights">${timing}${tableHTML}</aside></div>`;
  }
  function kmapTools(names,outNames){if(s.section==='sequential')return '';if(names.length<2||names.length>6)return `<p class="logic-subnote">K-maps support 2–6 variables; this model has ${names.length} inputs.</p>`;s.output=outNames.includes(s.output)?s.output:outNames[0];return `<div class="logic-kmap"><p class="logic-subnote">K-map variables: ${names.map((n,i)=>String.fromCharCode(65+i)+'='+n).map(esc).join(', ')}</p>${outNames.length>1?`<label for="logic-output-select">Output to simplify</label><select id="logic-output-select">${outNames.map(n=>`<option ${n===s.output?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}<button class="custom-btn" data-logic="kmap">Open ${esc(s.output)} in K-maps${icon('arrow')}</button></div>`;}
  document.addEventListener('change',event=>{if(!active)return;const el=event.target;if(el.id==='logic-choice-select'){const before=snapshot();if(s.section==='gates'){s.gate=el.value;s.gateInputs=Array(unary()?1:s.width).fill(true);}else if(s.section==='combinational'){s.circuit=el.value;s.combInputs=Array(C.circuits.find(c=>c.id===s.circuit).inputs.length).fill(false);}else{s.seq=el.value;reset();}s.page=0;s.expanded=false;s.output=null;persist();undo.record(before,snapshot());update();}else if(el.id==='logic-output-select'){s.output=el.value;update();}});
  document.addEventListener('click',event=>{const b=event.target.closest('button[data-logic]');if(!active||!b||b.disabled)return;const action=b.dataset.logic,before=['arity','input','rise','fall','pulse','release','reset'].includes(action)?snapshot():null;if(before||['undo','redo'].includes(action))onFeedback?.();switch(action){
   case 'undo':{const prev=undo.undo(snapshot());if(prev){apply(prev);renderLogic(document.getElementById('content'));}break;}
   case 'redo':{const next=undo.redo(snapshot());if(next){apply(next);renderLogic(document.getElementById('content'));}break;}
   case 'save-session':onSaveSession();break;
   case 'section':s.section=b.dataset.section;s.expanded=false;s.page=0;s.output=null;renderLogic(document.getElementById('content'));break;
   case 'arity':s.width=Number(b.dataset.n);s.gateInputs=Array(s.width).fill(false);s.page=0;persist();update();break;
   case 'input':{const i=Number(b.dataset.index),a=s.section==='gates'?s.gateInputs:s.section==='combinational'?s.combInputs:s.seqInputs;a[i]=!a[i];if(s.section==='sequential'){s.memory=L.update(spec(),s.memory,a,s.memory.clock);record();}else s.page=Math.floor(L.code(a)/16);update();break;}
   case 'diagram':s.expanded=!s.expanded;update();break;
   case 'rise':setClock(true);update();break;case 'fall':setClock(false);update();break;
   case 'pulse':if(s.memory.clock)setClock(false);setClock(true);setClock(false);update();break;
   case 'release':s.seqInputs=Array(2).fill(s.seq==='SR_NAND');s.memory=L.update(spec(),s.memory,s.seqInputs,false);record();update();break;
   case 'reset':reset();update();break;
   case 'previous':s.page--;update();break;case 'next':s.page++;update();break;
   case 'current':s.page=Math.floor((s.section==='gates'?L.code(s.gateInputs):s.section==='combinational'?L.code(s.combInputs):L.code(s.seqInputs)*(1<<spec().width)+s.memory.bits)/16);update();break;
   case 'copy':{const t=table();copy(tableText(s.section==='gates'?s.gate:s.section==='combinational'?s.circuit:s.seq,{headers:t.headers,rows:pageRows(t,s.page)}),t.total>16?'Visible truth-table page copied.':'Complete truth/state table copied.');break;}
   case 'kmap':{const names=s.section==='gates'?Array.from({length:s.gateInputs.length},(_,i)=>String.fromCharCode(65+i)):C.circuits.find(c=>c.id===s.circuit).inputs;const t=table(),index=t.headers.indexOf(s.output);onKmap(names.length,t.rows.map(r=>Number(r[index])));break;}
  }if(before){undo.record(before,snapshot());document.querySelector('[data-logic="undo"]').disabled=!undo.canUndo;document.querySelector('[data-logic="redo"]').disabled=!undo.canRedo;}});
  return {captureSession:(name,id)=>window.RadixStudy.Backup.session({id,name,kind:s.section,model:s.section==='gates'?s.gate:s.section==='combinational'?s.circuit:s.seq,width:s.section==='gates'?s.gateInputs.length:s.section==='combinational'?s.combInputs.length:spec().width,inputs:[...(s.section==='gates'?s.gateInputs:s.section==='combinational'?s.combInputs:s.seqInputs)],bits:s.section==='sequential'?s.memory.bits:null,clock:s.section==='sequential'?s.memory.clock:false}),restoreSession:session=>{const v=window.RadixStudy.Backup.session(session),before=snapshot();s.section=v.kind;s.expanded=false;s.page=0;s.output=null;if(v.kind==='gates'){s.gate=v.model;s.width=v.width===1?2:v.width;s.gateInputs=[...v.inputs];}else if(v.kind==='combinational'){s.circuit=v.model;s.combInputs=[...v.inputs];}else{s.seq=v.model;s.seqInputs=[...v.inputs];s.memory={bits:v.bits,clock:v.clock};tick=0;s.history=[{tick:0,clock:v.clock,inputs:[...v.inputs],outputs:L.outputs(spec(),s.memory,v.inputs)}];}persist();undo.record(before,snapshot());},clearHistory:()=>undo.clear(),renderLogic,deactivate:()=>{active=false;},goSection:section=>{s.section=section;s.page=0;s.expanded=false;s.output=null;renderLogic(document.getElementById('content'));},restoreSection:section=>{s.section=section;persist();},getSection:()=>s.section};
 };
})();
</script>
<script>(()=>{'use strict';
 window.RadixVisualHelp=function({dialog,navigate,logic,icon,esc,getTab}){
  const D=window.RadixDiagrams,L=window.RadixLogic;
  const steps=[
   ['convert',null,'#number-input','One number is all it takes.','Use Next to follow the highlights, then try the controls. Enter a signed integer, fraction or repeating number; results update instantly.'],
   ['convert',null,'.base-chips','Choose what the digits mean.','Select the source base before reading the result. Changing it reinterprets the same text. More offers every base 2–36.'],
   ['convert',null,'#show-working','Get the answer and the why.','Open Show the working for powers, division and fractional multiplication. Choose a target base and copy every step.'],
   ['kmap',null,'#k-grid','Make a bigger group.','Tap cells through 0 → 1 → X. Gray-code neighbors include opposite edges. Use powers of two; diagonal-only pairs are not groups.'],
   ['logic','gates','#logic-choice','Meet every standard gate.','Choose AND, OR, NOT, NAND, NOR, XOR, XNOR or BUFFER. Multi-input gates support 2–4 inputs.'],
   ['logic','gates','#logic-inputs','Your finger is the switch.','Tap a labeled input to flip 0/1. Highlighted wires carry 1; the output and truth table follow immediately.'],
   ['logic','gates','#logic-table','A table tells the whole story.','Every input combination is listed. The current row is highlighted. Copy the complete table or send a function with up to six inputs to K-maps.'],
   ['logic','combinational','#logic-diagram','Build ideas from gates.','Explore adders, subtractors, selectors, encoders and comparators. Block view fits phones; gate-level view scrolls locally to keep labels readable.'],
   ['logic','sequential','#logic-outputs','Now, give the circuit memory.','Latches respond to levels; flip-flops capture on rising edges. Q is stored state. X means unknown, not a disguised zero.'],
   ['logic','sequential','#logic-clock','A rising edge is the moment.','Clocked models have Rise, Fall and Pulse controls. A pulse captures once. Holding CLK high is not another rising edge. Latches have no clock controls.'],
   ['logic','sequential','#logic-timing','See the past, not just now.','The waveform records your latest actions, not real elapsed time. Follow CLK, inputs and Q; X marks indeterminate memory.'],
   ['more',null,'#more-help','Come back any time.','More keeps the expression/representation labs, practice, checkpoints, preferences, Saved, Bit Lab and this helper. Replay this tour whenever you need it. Everything works offline.']
  ];
  let index=-1,previousTab='convert',previousSection='gates',overlay=null,token=0;
  let seen=false;try{seen=localStorage.getItem('radix-tour-v3')==='seen';}catch(_){}
  const button=document.getElementById('visual-help-button');button.classList.toggle('new-helper',!seen);
  function mark(){seen=true;button.classList.remove('new-helper');try{localStorage.setItem('radix-tour-v3','seen');}catch(_){}}
  const card=(n,title,body,visual)=>`<section class="helper-card"><h3><span class="mono">${n}</span>${title}</h3><div class="helper-visual">${visual}</div><p>${body}</p></section>`;
  function open(){if(overlay)finish();const c=L.catalog.circuits.find(c=>c.id==='full-adder');document.getElementById('dialog-body').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">A little help. A lot of aha.</h2><button class="icon-btn" data-action="close-dialog" aria-label="Close visual helper">${icon('close')}</button></div><p id="dialog-description">See how to use every part of Radix. Built-in guidance—not an online chat or network service.</p><button class="solid-btn start-tour" data-guide="start">${icon('sparkle')}Start the visual app tour${icon('arrow')}</button><div class="helper-cards">${card('01','Convert without waiting','Choose a source base, type your number, then read or copy a result. Try decimal 255 → hexadecimal FF.','<div class="helper-number mono">255<small>DEC</small><span>→</span>FF<small>HEX</small></div>')}${card('02','Show the working','Open the sheet below the results. Integer remainders read bottom-to-top; fraction digits stay top-to-bottom.','<pre class="mono">13 ÷ 2 = 6, r1\n 6 ÷ 2 = 3, r0\n 3 ÷ 2 = 1, r1\n 1 ÷ 2 = 0, r1\n↑ read upward → 1101₂</pre>')}${card('03','K-maps are neighbor puzzles','Choose 2–6 variables and SOP/POS. X is optional. Check a group, then try a challenge and reveal its explanation.','<div class="helper-map mono"><span>0</span><span>1</span><span>1</span><span>1</span></div>')}${card('04','Gates are switches with rules','Open Logic → Gates. Tap an input; follow colored wires and the highlighted truth-table row. Output bubbles invert the result.',D.gate('AND',[true,false],false))}${card('05','Combine gates into useful circuits','Choose Combinational. Current inputs determine outputs; there is no stored memory. Use block view on phones, or swipe the gate-level implementation.',D.circuit(c,L.evaluate(c,[true,true,true]),false))}${card('06','Give logic a memory','Choose Sequential. Latches follow levels; flip-flops capture ↑CLK. Try Rise/Fall/Pulse and follow the action trace. A forbidden SR state is indeterminate—not zero.',D.block('D flip-flop',['D'],['Q',"Q'"],[1],[0,1],true))}${card('07','Keep, replay and explore','More opens Saved, the Bit Lab and this helper. Everything stays local; traces are teaching sessions, not real hardware measurements.','<div class="helper-links"><span>Saved</span><span>Bit Lab</span><span>Help</span></div>')}${card('08','Write logic, then prove it','More → Boolean expression lab accepts A–F (within the selected input prefix), 0/1 and Boolean operators. Inspect all rows, compare another expression and send SOP or POS to K-maps.',"<pre class=\"mono\">A′B + AB′ ≡ A XOR B\n00→0  01→1  10→1  11→0</pre>")}${card('09','A width changes the meaning','More → Number representations is separate from ordinary magnitude-first conversion. Pick a width, input code and signed interpretation. Gray and BCD are codes, not positional binary.',"<pre class=\"mono\">−13 at 8 bits\n00001101 → invert → +1\n11110011 = unsigned 243</pre>")}${card('10','Try, hint, check, understand','More → Logic practice has 108 cards. Check an answer, use a hint or reveal the explanation. Correct checks save mastery; revealing does not. No streak or penalty.','<div class="helper-links"><span>Try</span><span>→ Hint</span><span>→ Check</span></div>')}${card('11','Keep a safe checkpoint','Logic has Undo/Redo and Save session. More → Circuit checkpoints restores inputs, clock and memory with a fresh trace. Preferences & backup validates local JSON before replacing data; keys/passwords are excluded.','<pre class="mono">Undo ↶  •  Save  •  Restore ↷\nExport → Validate → Confirm</pre>')}</div>`;dialog.classList.remove('working-dialog');dialog.classList.add('help-dialog');dialog.scrollTop=0;if(!dialog.open)dialog.showModal();}
  function inert(value){document.querySelector('.shell').inert=value;document.querySelector('.mobile-nav').inert=value;}
  async function show(){const my=++token;const step=steps[index];navigate(step[0]);if(step[1])logic.goSection(step[1]);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));if(my!==token)return;let target=document.querySelector(step[2]);if(!target&&step[2]==='#logic-clock')target=document.getElementById('logic-choice');if(target)target.scrollIntoView({block:'center',behavior:'instant'});await new Promise(r=>requestAnimationFrame(r));if(my!==token)return;overlay.innerHTML=`<div class="tour-spotlight" aria-hidden="true"></div><section class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-text"><div class="label-row"><span class="section-label">VISUAL HELPER · ${index+1}/${steps.length}</span><button class="quiet-btn" data-guide="skip">Skip</button></div><h2 id="tour-title">${step[3]}</h2><p id="tour-text">${step[4]}</p><div class="tour-progress" aria-hidden="true">${steps.map((_,i)=>`<span class="${i<=index?'done':''}"></span>`).join('')}</div><div class="tour-actions"><button data-guide="back" ${index===0?'disabled':''}>Back</button><button data-guide="next">${index===steps.length-1?"Let's explore":'Next →'}</button></div></section>`;position();overlay.querySelector('[data-guide="next"]').focus({preventScroll:true});}
  function position(){if(!overlay||index<0)return;const step=steps[index],target=document.querySelector(step[2])||document.getElementById('logic-choice'),spot=overlay.querySelector('.tour-spotlight'),card=overlay.querySelector('.tour-card');if(!spot||!card)return;let r=target?target.getBoundingClientRect():{left:15,top:85,width:innerWidth-30,height:80};const x=Math.max(8,r.left-6),y=Math.max(12,Math.min(r.top-6,innerHeight-80)),w=Math.max(10,Math.min(r.width+12,innerWidth-x-8)),h=Math.max(30,Math.min(r.height+12,innerHeight*.39,innerHeight-y-20));Object.assign(spot.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});card.classList.toggle('above',y>innerHeight*.49);}
  function start(){if(dialog.open)dialog.close();mark();previousTab=getTab();previousSection=logic.getSection();index=0;overlay=document.createElement('div');overlay.className='visual-tour';document.body.appendChild(overlay);inert(true);show();}
  function finish(){if(!overlay)return;token++;overlay.remove();overlay=null;index=-1;inert(false);logic.restoreSection(previousSection);navigate(previousTab);document.getElementById('visual-help-button').focus({preventScroll:true});}
  document.addEventListener('click',e=>{const b=e.target.closest('button[data-guide]');if(!b||b.disabled)return;switch(b.dataset.guide){case 'start':start();break;case 'skip':finish();break;case 'back':if(index>0){index--;show();}break;case 'next':if(index===steps.length-1)finish();else{index++;show();}break;}});
  document.addEventListener('keydown',e=>{if(!overlay)return;if(e.key==='Escape'){e.preventDefault();finish();}if(e.key==='Tab'){const list=[...overlay.querySelectorAll('button:not(:disabled)')],first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  window.addEventListener('resize',position);window.addEventListener('scroll',position,{passive:true});dialog.addEventListener('close',()=>dialog.classList.remove('help-dialog'));
  return {open,start,close:finish};
 };
})();
</script>
<script>/* Radix 7 study tools: expression/representation/practice/checkpoints/local backups. */
(()=>{'use strict';
window.RadixStudyUI=function({dialog,icon,esc,toast,manualCopy,navigate,student,logic,getConverter,applyConverter}){
 const S=window.RadixStudy,Q=window.RadixPractice;
 const defaults={expression:{variables:2,left:"A'B + AB'",right:'A XOR B'},representation:{width:8,signed:true,mode:'decimal',input:'-13'},settings:{haptics:true,largeControls:false},sessions:[],progress:[],question:0};let stored={};try{stored=JSON.parse(localStorage.getItem('radix-study-v4')||'{}')||{};}catch(_){}
 const state=S.clone(defaults);
 try{if(stored.expression&&[2,3,4,5,6].includes(stored.expression.variables)&&typeof stored.expression.left==='string'&&typeof stored.expression.right==='string')state.expression={variables:stored.expression.variables,left:stored.expression.left.slice(0,256),right:stored.expression.right.slice(0,256)};if(stored.representation&&S.Representation.widths.includes(stored.representation.width)&&typeof stored.representation.signed==='boolean'&&['decimal','bits','gray'].includes(stored.representation.mode)&&typeof stored.representation.input==='string')state.representation={...stored.representation,input:stored.representation.input.slice(0,128)};if(stored.settings&&typeof stored.settings.haptics==='boolean'&&typeof stored.settings.largeControls==='boolean')state.settings={haptics:stored.settings.haptics,largeControls:stored.settings.largeControls};if(stored.sessions)state.sessions=S.Backup.sessions(JSON.stringify(stored.sessions));if(stored.progress)state.progress=S.Backup.progress(JSON.stringify(stored.progress));if(Number.isInteger(stored.question))state.question=Math.max(0,Math.min(Q.length-1,stored.question));}catch(_){}
 let active=null,exprBits=[true,false],practiceFilter='All',practiceTier=0,choice=null,checked=false,hint=false,revealed=false,validated=null,backupDraft='',backupError='';
 let storageWarned=false;
 function persist(){try{localStorage.setItem('radix-study-v4',JSON.stringify(state));return true;}catch(_){if(!storageWarned){storageWarned=true;toast("Device storage unavailable. Changes last this session; export a backup to keep them.");}return false;}}
 function feedback(){if(state.settings.haptics&&typeof navigator.vibrate==='function')try{navigator.vibrate(8);}catch(_){}}
 function settings(){document.documentElement.dataset.largeControls=String(state.settings.largeControls);}settings();
 function hero(first,second,eyebrow,subtitle){return `<button class="quiet-btn library-back" data-action="nav" data-tab="more">← More</button><section class="hero student-hero"><div><p class="eyebrow">${eyebrow}</p><h1>${first}<br><span class="accent">${second}</span></h1><p class="hero-copy">${subtitle}</p></div><div class="student-badge mono">LEARN<span>OFFLINE BY DESIGN</span></div></section>`;}
 const card=(title,body)=>`<section class="study-card">${title?`<h2>${esc(title)}</h2>`:''}${body}</section>`;
 const note=(text,error=false)=>`<p class="study-note ${error?'study-error':''}" ${error?'role="status"':''}>${esc(text)}</p>`;
 const value=(label,val)=>`<div class="study-value"><span>${esc(label)}</span><strong class="mono">${esc(val)}</strong></div>`;
 async function copy(text,message){let ok=false;try{await navigator.clipboard.writeText(text);ok=true;}catch(_){const t=document.createElement('textarea');t.value=text;Object.assign(t.style,{position:'fixed',opacity:0,top:0,left:0});document.body.append(t);t.select();try{ok=document.execCommand('copy');}catch(_){}t.remove();}if(ok){feedback();toast(message);}else manualCopy(text);}
 function renderExpression(container){active='expression';const s=state.expression;if(exprBits.length!==s.variables)exprBits=Array.from({length:s.variables},(_,i)=>i===0);
  container.innerHTML=hero('Write logic.','Prove the idea.','THE BOOLEAN EXPRESSION LAB','Real truth tables. Both forms. No guesswork.')+`<div class="study-workspace"><div>${card('Your expression',`<div class="study-options" aria-label="Variable count">${[2,3,4,5,6].map(n=>`<button data-study="expr-vars" data-n="${n}" class="${n===s.variables?'selected':''}" aria-pressed="${n===s.variables}">${n} variables</button>`).join('')}</div><label for="expr-left">Expression F</label><textarea id="expr-left" class="list-input mono" rows="2" maxlength="256" spellcheck="false" autocapitalize="characters">${esc(s.left)}</textarea><div class="expression-keypad">${['A','B','C','D','E','F',"'",' + ',' · ',' XOR ',' ⊙ ','(',')','0','1'].map(t=>`<button data-study="expr-token" data-token="${esc(t)}" ${/^[A-F]$/.test(t)&&t.charCodeAt(0)-65>=s.variables?'disabled':''}>${esc(t.trim())}</button>`).join('')}</div>${note("NOT / ' first; AND (including adjacency) next; XOR next; OR last. NAND/NOR/XNOR use the corresponding level and associate left-to-right.")}<div class="study-inline"><button data-study="expr-example" data-example="xor">XOR</button><button data-study="expr-example" data-example="demorgan">De Morgan</button><button data-study="expr-example" data-example="distribute">Distribute</button><button data-study="expr-clear">Clear</button></div><div id="expr-error" role="status"></div>`)}${card('Compare another expression',`<label for="expr-right">Expression G · optional</label><textarea id="expr-right" class="list-input mono" rows="2" maxlength="256" spellcheck="false" autocapitalize="characters">${esc(s.right)}</textarea><div id="expr-comparison" aria-live="polite"></div>${note('Compare every selected input combination, not just the current switches. A–F and constants 0/1 only; no scripting is executed.')}`)}</div><aside id="expr-results"></aside></div>`;
  document.getElementById('expr-left').addEventListener('input',e=>{state.expression.left=e.target.value;persist();updateExpression();});document.getElementById('expr-right').addEventListener('input',e=>{state.expression.right=e.target.value;persist();updateExpression();});updateExpression();
 }
 function exprReport(){return S.Expression.report(state.expression.left,state.expression.variables);}
 function updateExpression(){const s=state.expression;let report=null;try{report=exprReport();document.getElementById('expr-error').textContent='';}catch(e){document.getElementById('expr-error').innerHTML=note(e.message,true);}
  document.getElementById('expr-results').innerHTML=report?card('Follow the live function',`<div class="logic-inputs" aria-label="Expression inputs">${exprBits.map((v,i)=>`<button class="logic-bit ${v?'on':''}" data-study="expr-bit" data-index="${i}" aria-pressed="${v}"><span>${String.fromCharCode(65+i)}</span><strong>${Number(v)}</strong></button>`).join('')}</div><div id="expr-live" aria-live="polite">${value('F · CURRENT OUTPUT',report.cells[window.RadixLogic.code(exprBits)])}</div>${note('Parsed as '+report.normalized)}${value('MINIMUM SOP',report.sop)}${value('MINIMUM POS',report.pos)}${value('MINTERMS · Σm',report.sigmaM)}${value('MAXTERMS · ΠM',report.piM)}<div class="study-inline"><button data-study="expr-kmap" data-form="SOP">SOP K-map →</button><button data-study="expr-kmap" data-form="POS">POS K-map →</button></div>`)+card('Complete truth table',`<div class="logic-table-pan"><table class="truth-table" id="expr-truth"><thead><tr>${Array.from({length:s.variables},(_,i)=>`<th>${String.fromCharCode(65+i)}</th>`).join('')}<th>F</th></tr></thead><tbody>${report.cells.map((v,c)=>`<tr class="${c===window.RadixLogic.code(exprBits)?'current':''}">${window.RadixLogic.bits(c,s.variables).map(b=>`<td>${Number(b)}</td>`).join('')}<td>${v}</td></tr>`).join('')}</tbody></table></div><button class="custom-btn" data-study="expr-copy">${icon('copy')}Copy expression + complete table</button>`):'';
  let comparison='';if(s.right.trim()&&report){try{const c=S.Expression.compare(s.left,s.right,s.variables);comparison=`<p class="study-feedback ${c.equivalent?'success':'study-error'}">${c.equivalent?'✓ Equivalent in EVERY row':`Not equivalent · ${c.mismatches.length} different rows`}</p>${c.equivalent?'':note('Counterexamples: '+c.mismatches.map(i=>window.RadixLogic.binary(i,s.variables)).join(', '))}`;}catch(e){comparison=note(e.message,true);}}document.getElementById('expr-comparison').innerHTML=comparison;
 }
 function renderRepresentation(container){active='representation';const s=state.representation;
  container.innerHTML=hero('Same bits.','Different meaning.','THE NUMBER REPRESENTATION LAB','Choose a width. Read the value. Understand the sign.')+`<div class="study-workspace"><div>${card('Encode or decode',`<div class="study-options rep-widths" aria-label="Bit width">${S.Representation.widths.map(w=>`<button data-study="rep-width" data-width="${w}" class="${w===s.width?'selected':''}" aria-pressed="${w===s.width}">${w} bits</button>`).join('')}</div><div class="study-options rep-modes">${[['decimal','Decimal'],['bits','Binary word'],['gray','Gray code']].map(([key,label])=>`<button data-study="rep-mode" data-mode="${key}" class="${key===s.mode?'selected':''}">${label}</button>`).join('')}</div><label class="study-switch"><span><strong>Two’s-complement interpretation</strong><small>Off = unsigned decimal input/range</small></span><input type="checkbox" id="rep-signed" ${s.signed?'checked':''}></label><label for="rep-input">${s.mode==='decimal'?'Whole decimal integer':s.mode==='gray'?'Gray-code word':'Binary word'}</label><input id="rep-input" class="list-input mono" value="${esc(s.input)}" maxlength="128" autocomplete="off" spellcheck="false"><div id="rep-error" role="status"></div>`)}${note('This lab is fixed-width. The original Convert tab uses signed magnitude for negative values; it does not automatically mean two’s complement.')}</div><aside id="rep-results"></aside></div>`;
  document.getElementById('rep-input').addEventListener('input',e=>{s.input=e.target.value;persist();updateRepresentation();});document.getElementById('rep-signed').addEventListener('change',e=>{s.signed=e.target.checked;persist();updateRepresentation();});updateRepresentation();
 }
 function repReport(){const s=state.representation;return S.Representation.report(s.input,s.width,s.signed,s.mode);}
 function updateRepresentation(){let r;try{r=repReport();document.getElementById('rep-error').textContent='';}catch(e){document.getElementById('rep-error').innerHTML=note(e.message,true);document.getElementById('rep-results').innerHTML='';return;}
  const groups=word=>word.match(/.{1,4}/g).join(' ');
  document.getElementById('rep-results').innerHTML=card('One word, two interpretations',value(r.width+'-BIT BINARY WORD',groups(r.word))+value('UNSIGNED',r.unsigned)+value('TWO’S COMPLEMENT',r.signed)+value('HEX · SAME WORD',r.hex)+note('Selected decimal range: '+r.range+'. No overflowing value is wrapped or silently truncated.'))+card('One’s complement · invert every bit',value('INVERTED WORD',groups(r.ones))+value('ONE’S-COMPLEMENT VALUE',r.onesSigned)+note('One’s complement negates by flipping bits only — no +1. So zero has two faces: all-0s (+0) and all-1s (−0).'))+card('Codes are not the same as binary',value('GRAY CODE OF THIS WORD',groups(r.gray))+value('BCD OF THE SELECTED DECIMAL VALUE',r.bcd===null?'Not defined for negative values':r.bcd)+note('Gray changes one bit between consecutive non-negative counts. BCD encodes each decimal digit separately; nibbles 1010–1111 are not decimal digits.'))+card('Show the working',`<ol class="study-working">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><button class="custom-btn" data-study="rep-copy">${icon('copy')}Copy complete working</button>`);
 }
 function practiceQuestion(){return Q[state.question];}
 function selectQuestion(index){state.question=index;choice=null;checked=false;hint=false;revealed=false;persist();}
 function renderPractice(container){active='practice';const q=practiceQuestion(),filtered=Q.filter(q=>(practiceTier===0||q.tier===practiceTier-1)&&(practiceFilter==='All'||q.category===practiceFilter));
  container.innerHTML=hero('Try the idea.','Keep the lesson.','YOUR LOGIC PRACTICE HUB','Hints before answers. Understanding before scores.')+`<div class="study-workspace"><div>${card(`${state.progress.length} of ${Q.length} mastered`,`<p class="study-note">A correct check counts as mastered. Revealing does not. No streaks, penalties or account.</p><div class="study-filters">${['All',...new Set(Q.map(q=>q.category))].map(c=>`<button data-study="practice-filter" data-category="${c}" class="${c===practiceFilter?'selected':''}">${c}</button>`).join('')}</div><div class="study-filters">${['All levels','Easy','Intermediate','Advanced'].map((t,i)=>`<button data-study="practice-tier" data-tier="${i}" class="${i===practiceTier?'selected':''}">${t}</button>`).join('')}</div><label for="practice-question">Choose study card · ${state.question+1}/${Q.length}</label><select id="practice-question" class="list-input">${filtered.map(question=>`<option value="${Q.indexOf(question)}" ${question.id===q.id?'selected':''}>${state.progress.includes(question.id)?'✓ ':''}${esc(question.title)}</option>`).join('')}</select>`)}<button class="quiet-btn" data-study="practice-reset">Reset practice progress</button></div><aside>${card(q.title,`<span class="section-label">${q.category.toUpperCase()} · ${['EASY','INTERMEDIATE','ADVANCED'][q.tier]}</span><p class="practice-prompt">${esc(q.prompt)}</p><div class="practice-options">${q.choices.map((a,i)=>`<button data-study="practice-choice" data-index="${i}" class="${choice===i?'selected':''}" aria-pressed="${choice===i}" ${revealed?'disabled':''}>${esc(a)}</button>`).join('')}</div><button class="solid-btn" data-study="practice-check" ${choice===null||revealed?'disabled':''}>Check my answer${icon('check')}</button>${checked?`<p class="study-feedback ${choice===q.answer?'success':'study-error'}" role="status">${choice===q.answer?'✓ Correct. Here’s why.':'Not yet. Try the hint and check again.'}</p>`:''}${checked&&choice===q.answer||revealed?note(q.explanation):''}<div class="study-inline"><button data-study="practice-hint">${hint?'Hide hint':'Show a hint'}</button><button data-study="practice-reveal">Reveal & explain</button></div>${hint?note(q.hint):''}${revealed?`<p class="study-feedback success">Answer: ${esc(q.choices[q.answer])}</p>`:''}<div class="study-inline"><button data-study="practice-previous">← Previous</button><button data-study="practice-next">Next idea →</button></div>`)}</aside></div>`;
  document.getElementById('practice-question').addEventListener('change',e=>{selectQuestion(Number(e.target.value));renderPractice(container);});
 }
 function renderSessions(container){active='sessions';container.innerHTML=hero('Save the state.','Return to the idea.','YOUR CIRCUIT CHECKPOINTS','Named, offline and ready when you are.')+note('Save a checkpoint from Logic. It restores the model, inputs, clock and memory; timing starts fresh. Up to 24 sessions stay on this device.')+`<div class="study-session-grid">${state.sessions.length?state.sessions.map(s=>card(s.name,note(`${s.model} · ${s.kind} · inputs ${s.inputs.map(Number).join('')}${s.kind==='sequential'?` · Q=${window.RadixLogic.binary(s.bits,s.width)} · CLK=${Number(s.clock)}`:''}`)+`<div class="study-inline"><button data-study="session-restore" data-id="${s.id}">Restore →</button><button data-study="session-delete" data-id="${s.id}">Delete</button></div>`)).join(''):card('Your first checkpoint awaits',note('Open Logic, explore a circuit, then tap Save session.')+'<button class="solid-btn" data-action="nav" data-tab="logic">Open Logic →</button>')}</div>`;}
 function backupText(){return S.Backup.encode({saved:getConverter().saved,sessions:state.sessions,progress:[...state.progress].sort(),kmap:student.getMap(),expression:state.expression,representation:state.representation,settings:state.settings,converter:getConverter().converter});}
 function restoreBackup(data){const b=S.Backup.decode(S.Backup.encode(data));state.sessions=b.sessions;state.progress=b.progress;state.expression=b.expression;state.representation=b.representation;state.settings=b.settings;student.restoreMap(b.kmap);logic.clearHistory();applyConverter(b);persist();settings();choice=null;checked=false;hint=false;revealed=false;}
 function renderPreferences(container){active='preferences';container.innerHTML=hero('Make it yours.','Keep it safe.','PREFERENCES & OFFLINE BACKUP','No cloud. No account. Your study data stays yours.')+`<div class="study-workspace"><div>${card('Comfort controls',`<label class="study-switch"><span><strong>Haptic feedback</strong><small>Allow short feedback where the browser supports it</small></span><input type="checkbox" id="pref-haptics" ${state.settings.haptics?'checked':''}></label><label class="study-switch"><span><strong>Larger learning controls</strong><small>More room for circuit inputs and study actions</small></span><input type="checkbox" id="pref-large" ${state.settings.largeControls?'checked':''}></label>`)}${card('Create a portable backup',note('Includes saved conversions, circuit checkpoints, mastery, the current K-map/lab drafts and preferences. Traces and signing keys/passwords are excluded. JSON is NOT encrypted; store it privately.')+'<button class="solid-btn" data-study="backup-download">Save backup file →</button><button class="custom-btn" data-study="backup-copy">'+icon('copy')+'Copy backup text</button>')}</div><aside>${card('Validate, then restore',`<label class="backup-file custom-btn">Choose backup file<input type="file" id="backup-file" accept="application/json,text/plain,.json"></label><label for="backup-text">Or paste backup JSON · maximum 256 KiB</label><textarea id="backup-text" class="list-input mono" rows="6" maxlength="262144" spellcheck="false">${esc(backupDraft)}</textarea><button class="solid-btn" data-study="backup-validate" ${!backupDraft.trim()?'disabled':''}>Validate backup${icon('check')}</button><div id="backup-result" role="status"></div>`)}</aside></div>`;
  document.getElementById('pref-haptics').addEventListener('change',e=>{state.settings.haptics=e.target.checked;persist();});document.getElementById('pref-large').addEventListener('change',e=>{state.settings.largeControls=e.target.checked;settings();persist();});document.getElementById('backup-text').addEventListener('input',e=>{backupDraft=e.target.value;validated=null;backupError='';document.querySelector('[data-study="backup-validate"]').disabled=!backupDraft.trim();updateBackup();});document.getElementById('backup-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;validated=null;backupError='';try{if(file.size>262144)throw Error('Backup exceeds 256 KiB.');backupDraft=await file.text();document.getElementById('backup-text').value=backupDraft;document.querySelector('[data-study="backup-validate"]').disabled=false;toast('Backup loaded. Validate before restoring.');}catch(error){backupError=error.message;}updateBackup();});updateBackup();
 }
 function updateBackup(){const el=document.getElementById('backup-result');if(!el)return;el.innerHTML=backupError?note(backupError,true):validated?note(`✓ Valid: ${validated.saved.length} conversions · ${validated.sessions.length} sessions · ${validated.progress.length} mastered cards · ${validated.kmap.variables}-variable ${validated.kmap.form} map.`)+'<button class="custom-btn" data-study="backup-review">Review replacement & restore</button>':'';}
 function modal(title,description,body){document.getElementById('dialog-body').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${esc(title)}</h2><button class="icon-btn" data-action="close-dialog" aria-label="Close dialog">${icon('close')}</button></div><p id="dialog-description">${esc(description)}</p>${body}`;dialog.classList.remove('working-dialog');dialog.scrollTop=0;if(!dialog.open)dialog.showModal();}
 function saveCurrentSession(){if(state.sessions.length>=24){toast('Session library is full (24). Back up/delete an older checkpoint first.');return;}const sample=logic.captureSession('New checkpoint','preview');modal('Save a circuit checkpoint','Current inputs, clock and memory are kept. The trace starts fresh on restore.',`<label for="session-name">Session name · up to 40 characters</label><input id="session-name" class="list-input" value="${esc(sample.model)}" maxlength="40"><p id="session-error" class="study-error" role="status"></p><button class="solid-btn" data-study="session-save">Save session${icon('bookmark')}</button>`);document.getElementById('session-name').focus();}

 document.addEventListener('click',event=>{const b=event.target.closest('button[data-study]');if(!b||b.disabled)return;const action=b.dataset.study,container=document.getElementById('content');if(['expr-bit','expr-vars','rep-width','rep-mode','practice-choice','practice-check'].includes(action))feedback();

   case 'expr-example':{const examples={xor:["A'B + AB'",'A XOR B'],demorgan:['!(A B)',"A'+B'"],distribute:['A(B+C)','AB+AC']};[state.expression.left,state.expression.right]=examples[b.dataset.example];if(b.dataset.example==='distribute')state.expression.variables=Math.max(3,state.expression.variables);persist();renderExpression(container);break;}

   case 'expr-bit':exprBits[Number(b.dataset.index)]=!exprBits[Number(b.dataset.index)];updateExpression();break;

   case 'expr-copy':{const r=exprReport(),n=state.expression.variables;copy(`F = ${state.expression.left}\nParsed: ${r.normalized}\nSOP: ${r.sop}\nPOS: ${r.pos}\n${r.sigmaM}\n${r.piM}\n`+Array.from({length:n},(_,i)=>String.fromCharCode(65+i)).concat('Y').join('\t')+'\n'+r.cells.map((v,c)=>window.RadixLogic.bits(c,n).map(Number).concat(v).join('\t')).join('\n'),'Expression report copied.');break;}

   case 'rep-mode':{const key=b.dataset.mode;state.representation.mode=key;state.representation.input=key==='decimal'?'-13':key==='bits'?'11110011':'0110';state.representation.width=Math.max(8,state.representation.width);persist();renderRepresentation(container);break;}
   case 'rep-copy':{const r=repReport();copy(`${r.width}-bit representations\nInput: ${state.representation.input} (${state.representation.mode})\nWord: ${r.word}\nUnsigned: ${r.unsigned}\nTwo’s complement: ${r.signed}\nHex: ${r.hex}\nGray: ${r.gray}\nBCD: ${r.bcd===null?'not defined':r.bcd}\nRange: ${r.range}\n`+r.steps.join('\n'),'Representation working copied.');break;}
   case 'practice-filter':practiceFilter=b.dataset.category;{const ti=Q.findIndex(q=>(practiceTier===0||q.tier===practiceTier-1)&&(practiceFilter==='All'||q.category===practiceFilter));if(ti>=0)selectQuestion(ti);}renderPractice(container);break;
   case 'practice-tier':practiceTier=Number(b.dataset.tier);{const ti=Q.findIndex(q=>(practiceTier===0||q.tier===practiceTier-1)&&(practiceFilter==='All'||q.category===practiceFilter));if(ti>=0)selectQuestion(ti);}renderPractice(container);break;
   case 'practice-choice':choice=Number(b.dataset.index);checked=false;renderPractice(container);break;
   case 'practice-check':checked=true;if(choice===practiceQuestion().answer&&!revealed&&!state.progress.includes(practiceQuestion().id)){state.progress.push(practiceQuestion().id);persist();}renderPractice(container);break;
   case 'practice-hint':hint=!hint;renderPractice(container);break;
   case 'practice-reveal':revealed=true;renderPractice(container);break;
   case 'practice-previous':case 'practice-next':{const list=Q.filter(q=>practiceFilter==='All'||q.category===practiceFilter),index=list.indexOf(practiceQuestion()),next=(index+(action==='practice-next'?1:-1)+list.length)%list.length;selectQuestion(Q.indexOf(list[next]));renderPractice(container);break;}
   case 'practice-reset':modal('Reset mastered cards?','Only practice progress is cleared. Circuits, conversions and K-maps stay unchanged.','<button class="solid-btn" data-study="practice-confirm-reset">Reset progress</button>');break;
   case 'session-restore':{const session=state.sessions.find(s=>s.id===b.dataset.id);if(session){logic.restoreSession(session);navigate('logic');toast('Session restored; fresh timing trace.');}break;}
   case 'session-delete':{const session=state.sessions.find(s=>s.id===b.dataset.id);if(session)modal('Delete '+session.name+'?','This removes the saved checkpoint, not the current circuit. Export a backup first if you want a copy.',`<button class="solid-btn" data-study="session-confirm-delete" data-id="${session.id}">Delete checkpoint</button>`);break;}
   case 'backup-download':{const text=backupText();backupDraft=text;validated=null;backupError='';document.getElementById('backup-text').value=text;document.querySelector('[data-study="backup-validate"]').disabled=false;updateBackup();if(window.self!==window.top){toast('Preview downloads may be blocked. Copy the backup text below.');break;}const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Radix-study-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Offline backup ready. Store it privately.');break;}
   case 'backup-copy':{backupDraft=backupText();validated=null;backupError='';document.getElementById('backup-text').value=backupDraft;document.querySelector('[data-study="backup-validate"]').disabled=false;updateBackup();copy(backupDraft,'Backup text copied; store it privately.');break;}
   case 'backup-validate':try{validated=S.Backup.decode(backupDraft);backupError='';}catch(e){validated=null;backupError=e.message;}updateBackup();break;
   case 'backup-review':if(validated)modal('Replace local study data?','The validated backup REPLACES your saved conversions, sessions, mastery, K-map, lab drafts and preferences. Export a backup first. The active circuit is not changed.','<button class="solid-btn" data-study="backup-confirm">Replace & restore</button>');break;
  }
 });
 return {render,deactivate:()=>{active=null;},saveCurrentSession,feedback,haptics:()=>state.settings.haptics,sessionCount:()=>state.sessions.length,progressCount:()=>state.progress.length};
};
})();

 const study = window.RadixStudyUI({dialog,icon,esc,toast,manualCopy,navigate,student,logic,getConverter:()=>({saved:state.saved,converter:{number:state.number,base:state.base,custom:state.custom,bits:state.bits,dark:state.theme==='dark'}}),applyConverter:data=>{state.saved=data.saved;const c=data.converter;state.number=c.number;state.base=c.base;state.custom=c.custom;state.bits=c.bits;state.theme=c.dark?'dark':'light';persist();theme();}});

 }
 function renderSaved() {
  content.innerHTML = `<button class="quiet-btn library-back" data-action="nav" data-tab="more">← More</button>` + hero('Good numbers.','Worth keeping.','YOUR PERSONAL NUMBER COLLECTION','Saved on your device. Ready when you are.') + (state.saved.length ? `<div class="section-label">${state.saved.length} SAVED · UP TO 50</div><div class="saved-list">${state.saved.map(item => `<article class="saved-card"><div class="saved-top"><span class="saved-base">${E.name(item.base)} · base ${item.base}</span><button class="icon-btn" data-action="delete" data-id="${item.id}" aria-label="Delete saved conversion ${esc(item.input)}">${icon('delete')}</button></div><div class="saved-value">${esc(item.input)}</div><div class="saved-bottom"><span>${esc(new Date(item.id).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}))}</span><button class="quiet-btn primary" data-action="restore" data-id="${item.id}">Open conversion${icon('arrow')}</button></div></article>`).join('')}</div>` : `<section class="empty-state"><div class="empty-icon">${icon('bookmark')}</div><h2>Nothing saved. Yet.</h2><p>Tap Save on a conversion to keep it here.<br>Your collection stays completely offline.</p><button class="solid-btn" data-action="nav" data-tab="convert">Make a conversion${icon('arrow')}</button></section>`);
 }
 function renderLab() {
  content.innerHTML = `<button class="quiet-btn library-back" data-action="nav" data-tab="more">← More</button>` + hero('A little bit.','A lot of magic.','THE 8-BIT PLAYGROUND','Tap a bit. Watch every number change.') + `<div class="bit-workspace"><section class="bit-panel" aria-label="Interactive 8-bit lab"><div class="label-row"><span class="section-label">BUILD YOUR BYTE</span><span class="base-label">0–255</span></div><div class="bits" id="bit-buttons"></div><div class="bit-actions"><button class="quiet-btn" data-action="bits-off">All off</button><button class="quiet-btn" data-action="bits-on">All on</button><button class="quiet-btn" data-action="bits-random">${icon('dice')}Surprise me</button></div><div class="bit-answer"><span class="big-number" id="bit-decimal"></span><span class="answer-label">decimal</span><div class="bit-other"><span id="bit-hex"></span><span id="bit-octal"></span></div></div><p class="bit-formula" id="bit-formula"></p><button class="solid-btn" data-action="use-bits">Take it to the converter${icon('arrow')}</button></section><aside class="lessons"><span class="section-label">THE IDEA BEHIND THE DIGITS</span>${lesson('01','Binary is just yes or no.','Each bit is a switch: 0 is off and 1 is on. From right to left, the positions are worth 1, 2, 4, 8, 16, 32, 64 and 128. Add the positions that are switched on.',true)}${lesson('FF','Hex makes binary bite-size.','One hexadecimal digit represents four bits. 1111 in binary is F in hex, so 1111 1111 becomes FF. The digits are 0–9 followed by A–F.')}${lesson('10','The base changes the place.','In any base, each position is worth a power of that base. 10 in binary means 2 in decimal. 10 in hexadecimal means 16. Same digits, different perspective.')}<p class="lesson-tip">One byte. Eight switches. 256 possibilities.<br>The smallest ideas can open up a whole new world.</p></aside></div>`;
  updateBits();
 }
 function lesson(symbol,title,body,open = false) { return `<details class="lesson" ${open ? 'open' : ''}><summary><span class="mono">${symbol}</span><span class="lesson-title">${title}</span>${icon('down')}</summary><p>${body}</p></details>`; }
 function updateBits() {
  document.getElementById('bit-buttons').innerHTML = Array.from({length:8},(_,i) => 7-i).map(bit => {
   const on = !!(state.bits & (1 << bit));
   return `<div class="bit-col"><button class="bit-btn ${on ? 'on' : ''}" id="bit-${bit}" data-action="bit" data-bit="${bit}" aria-label="Toggle bit ${bit}, weight ${1 << bit}" aria-pressed="${on}">${on ? 1 : 0}</button><span class="bit-weight">${1 << bit}</span></div>`;
  }).join('');
  document.getElementById('bit-decimal').textContent = state.bits;
  document.getElementById('bit-hex').textContent = state.bits.toString(16).toUpperCase() + ' HEX';
  document.getElementById('bit-octal').textContent = state.bits.toString(8) + ' OCT';
  const weights = Array.from({length:8},(_,i) => 7-i).filter(bit => state.bits & (1 << bit)).map(bit => 1 << bit);
  document.getElementById('bit-formula').textContent = (weights.length ? weights.join(' + ') : '0') + ' = ' + state.bits;
 }
 function renderMore() {
  const cards=[['expression','grid','Boolean expression lab','Truth tables, SOP/POS and equivalence.'],['representation','precision','Number representations','Two’s complement, widths, Gray and BCD.'],['practice','sparkle','Logic practice hub',`${window.RadixPractice.length} hints/check/reveal cards · ${study.progressCount()} mastered`],['sessions','bookmark','Circuit checkpoints',`${study.sessionCount()} named inputs/clock/memory sessions`],['saved','bookmark','Saved conversions',`${state.saved.length} saved · local to your device`],['lab','dice','The 8-bit playground','Build a byte, one switch at a time.'],['preferences','lock','Preferences & offline backup','Comfort controls and portable study data.']];
  content.innerHTML = hero('A little extra.','A lot to explore.','YOUR LEARNING TOOLBOX','Everything offline. Everything within a tap.',false) + `<div class="more-grid">${cards.map(([tab,image,title,body])=>`<button class="more-card" data-action="nav" data-tab="${tab}">${icon(image)}<span><strong>${title}</strong><small>${body}</small></span>${icon('arrow')}</button>`).join('')}<button class="more-card" data-action="help" id="more-help">${icon('sparkle')}<span><strong>Visual helper & app tour</strong><small>Illustrated lessons and replayable highlights.</small></span>${icon('arrow')}</button></div>`;
 }
 function render() { nav(); student.deactivate(); logic.deactivate(); study.deactivate(); if (state.tab === 'saved') renderSaved(); else if (state.tab === 'lab') renderLab(); else if (state.tab === 'kmap') student.renderKmap(content); else if (state.tab === 'logic') logic.renderLogic(content); else if (state.tab === 'more') renderMore(); else if (['expression','representation','practice','sessions','preferences'].includes(state.tab)) study.render(state.tab,content); else renderConvert(); }
 function navigate(tab) { if (!['convert','saved','lab','kmap','logic','more','expression','representation','practice','sessions','preferences'].includes(tab)) return; if (tab !== state.tab) state.workingMode = false; document.body.classList.remove('is-editing'); state.tab = tab; render(); window.scrollTo({top:0,behavior:'instant'}); }
 function showPicker(kind) {
  pickerType = kind === 'output' ? 'output' : 'source';
  const selected = pickerType === 'source' ? state.base : (state.custom || 12);
  document.getElementById('dialog-body').innerHTML = `<div class="dialog-head"><h2 id="dialog-title">${pickerType === 'source' ? 'Choose your source base.' : 'A different perspective.'}</h2><button class="icon-btn" data-action="close-dialog" aria-label="Close base chooser">${icon('close')}</button></div><p id="dialog-description">${pickerType === 'source' ? 'Changing the base reinterprets your current input.' : 'Add any base from 2 to 36 to your results.'}</p><div class="base-grid">${Array.from({length:35},(_,i) => i+2).map(base => `<button class="grid-base ${selected === base ? 'selected' : ''}" data-action="choose-base" data-base="${base}" aria-label="Base ${base}${[2,8,10,16].includes(base) ? ', ' + E.name(base) : ''}" aria-pressed="${selected === base}"><span class="mono">${base}</span>${[2,8,10,16].includes(base) ? `<small>${E.shortName(base)}</small>` : ''}</button>`).join('')}</div>`;
  dialog.classList.remove('working-dialog'); dialog.scrollTop = 0; dialog.showModal();
 }
 function manualCopy(raw) {
  const multiline = raw.includes('\n');
  document.getElementById('dialog-body').innerHTML = `<div class="dialog-head"><h2 id="dialog-title">${multiline ? 'Copy your working.' : 'Copy your number.'}</h2><button class="icon-btn" data-action="close-dialog" aria-label="Close copy dialog">${icon('close')}</button></div><p id="dialog-description">Clipboard access is blocked in this preview. Select this text and copy it manually.</p>${multiline ? `<textarea id="manual-copy" class="list-input mono" rows="12" readonly aria-label="Full working to copy">${esc(raw)}</textarea>` : `<input id="manual-copy" class="number-input" style="font-size:20px" value="${esc(raw)}" readonly aria-label="Ungrouped result to copy">`}`;
  dialog.classList.toggle('working-dialog',multiline); dialog.scrollTop = 0;
  if (!dialog.open) dialog.showModal(); const input = document.getElementById('manual-copy'); input.focus(); input.select();
 }
 async function copy(base) {
  const output = outputs.get(base); if (!output) return;
  let copied = false;
  try { await navigator.clipboard.writeText(output.raw); copied = true; } catch (_) {
   const el = document.createElement('textarea'); el.value = output.raw;
   Object.assign(el.style,{position:'fixed',left:'0',top:'0',width:'1px',height:'1px',opacity:'0'});
   document.body.appendChild(el); el.select();
   try { copied = document.execCommand('copy'); } catch (_) {} el.remove();
  }
  if (copied) { toast(output.exact ? `${E.name(base)} copied. Nice.` : 'Approximate value copied · 24 fractional places.'); study.feedback(); }
  else manualCopy(output.raw);
 }
 document.addEventListener('click',async event => {
  const button = event.target.closest('button[data-action]'); if (!button || button.disabled) return;
  const action = button.dataset.action;
  switch (action) {
   case 'nav': navigate(button.dataset.tab); break;
   case 'help': visualHelp.open(); break;
   case 'working': if (E.parse(state.number,state.base).kind === 'valid') student.showWorking(state.number,state.base,2); break;
   case 'open-lab': {
    const p = E.parse(state.number,state.base);
    if (p.kind === 'valid' && p.value.d === 1n && p.value.n >= 0n && p.value.n <= 255n) state.bits = Number(p.value.n);
    persist(); navigate('lab'); break;
   }
   case 'theme': state.theme = state.theme === 'dark' ? 'light' : 'dark'; theme(); persist(); break;
   case 'source-base': state.base = Number(button.dataset.base); persist(); renderConvert(); break;
   case 'picker': showPicker(button.dataset.kind); break;
   case 'close-dialog': dialog.close(); break;
   case 'choose-base': {
    const base = Number(button.dataset.base); if (!Number.isInteger(base) || base < 2 || base > 36) return;
    if (pickerType === 'source') state.base = base; else state.custom = base;
    persist(); dialog.close(); renderConvert(); break;
   }
   case 'remove-custom': state.custom = null; persist(); updateConversions(); break;
   case 'clear': state.number = ''; persist(); document.getElementById('number-input').value = ''; updateConversions(); document.getElementById('number-input').focus(); break;
   case 'paste': {
    try {
     const text = await navigator.clipboard.readText();
     if (!text) { toast('Your clipboard is empty.'); break; }
     state.number = text.slice(0,600); persist(); document.getElementById('number-input').value = state.number; updateConversions();
    } catch (_) { document.getElementById('number-input').focus(); toast('Use your keyboard or long-press to paste here.'); }
    break;
   }
   case 'surprise': {
    const choices = [42,255,1024,1337,65535].map(n => n.toString(state.base).toUpperCase()).filter(n => n !== state.number);
    state.number = choices[Math.floor(Math.random()*choices.length)]; persist(); document.getElementById('number-input').value = state.number; updateConversions(); break;
   }
   case 'save': {
    if (E.parse(state.number,state.base).kind !== 'valid') break;
    const input = state.number.trim(), previous = state.saved.find(item => item.input === input && item.base === state.base);
    const item = {id:previous ? previous.id : Date.now(),input,base:state.base};
    state.saved = [item,...state.saved.filter(n => n.id !== item.id)].slice(0,50);
    const saved = persist(); nav(); toast(saved ? 'Saved. A good number to keep.' : 'Saved for this preview session.'); break;
   }
   case 'delete': state.saved = state.saved.filter(item => item.id !== Number(button.dataset.id)); persist(); render(); toast('Removed from saved numbers.'); break;
   case 'restore': {
    const item = state.saved.find(n => n.id === Number(button.dataset.id));
    if (item) { state.number = item.input; state.base = item.base; persist(); navigate('convert'); } break;
   }
   case 'quick-copy':
   case 'copy': await copy(Number(button.dataset.base)); break;
   case 'bit': {
    const bit = Number(button.dataset.bit); state.bits ^= (1 << bit); updateBits(); persist(); document.getElementById(`bit-${bit}`).focus({preventScroll:true}); break;
   }
   case 'bits-off': state.bits = 0; updateBits(); persist(); break;
   case 'bits-on': state.bits = 255; updateBits(); persist(); break;
   case 'bits-random': state.bits = Math.floor(Math.random()*256); updateBits(); persist(); break;
   case 'use-bits': state.number = String(state.bits); state.base = 10; persist(); navigate('convert'); break;
  }
 });
 dialog.addEventListener('click',event => { if (event.target === dialog) { const r = dialog.getBoundingClientRect(); if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) dialog.close(); } });
 document.addEventListener('keydown',event => { if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); if (state.tab !== 'convert') navigate('convert'); document.getElementById('number-input').focus(); document.getElementById('number-input').select(); } });
 theme(); render();
})();
</script>
