:root { color-scheme:dark; --bg:#111410; --surface:#1b2019; --surface2:#242a20; --line:#323a2c; --line-soft:#293125; --ink:#f3f5ed; --muted:#939e88; --dim:#87937a; --lime:#d2fa69; --accent:#d2fa69; --blue:#a8cbff; --pink:#efb0cb; --error:#ffaaa7; --shadow:0 20px 70px #0003; }
html[data-theme="light"] { color-scheme:light; --bg:#f4f5ed; --surface:#fff; --surface2:#ecefe4; --line:#d9dfce; --line-soft:#e3e8da; --ink:#1a2116; --muted:#67715d; --dim:#68745b; --accent:#52710d; --blue:#355f9c; --pink:#9f3d6a; --error:#b3261e; --shadow:0 20px 70px #23330b0a; }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:'Space Grotesk',sans-serif; -webkit-font-smoothing:antialiased; }
button,input { font:inherit; }
button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
button:disabled { cursor:default; opacity:.38; }
button, a, input, summary { outline-offset:4px; }
button:focus-visible,input:focus-visible,summary:focus-visible { outline:2px solid var(--accent); }
button { color:inherit; }
::selection { background:var(--lime); color:#111410; }
svg { width:20px; height:20px; flex-shrink:0; vertical-align:middle; }
.mono { font-family:'JetBrains Mono',monospace; }
.shell { max-width:1160px; margin:auto; padding:0 40px; }
.topbar { min-height:106px; display:flex; align-items:center; justify-content:space-between; gap:24px; border-bottom:1px solid var(--line-soft); }
.brand { display:flex; align-items:center; gap:12px; color:var(--ink); text-decoration:none; border:0; background:none; padding:0; }
.logo { width:42px; height:42px; background:var(--lime); color:#111410; border-radius:13px; display:flex; align-items:center; justify-content:center; position:relative; }
.logo>span { font-weight:700; font-size:33px; line-height:1; letter-spacing:-3px; transform:translate(-2px,-1px); }
.logo small { font-size:21px; letter-spacing:-1px; }
.logo sup { position:absolute; right:9px; top:6px; font-size:9px; font-weight:700; }
.wordmark { font-size:29px; font-weight:700; letter-spacing:-1.7px; }
.topnav { display:flex; gap:6px; padding:5px; background:var(--surface); border:1px solid var(--line-soft); border-radius:16px; }
.nav-btn { min-height:44px; border:0; background:none; color:var(--muted); border-radius:11px; padding:0 18px; display:flex; align-items:center; gap:8px; font-size:13px; }
.nav-btn svg { width:17px; height:17px; }
.nav-btn.active { background:var(--surface2); color:var(--ink); font-weight:700; }
.nav-btn.active svg { color:var(--accent); }
.saved-count { display:none; font-size:9px; line-height:16px; min-width:16px; padding:0 3px; border-radius:5px; background:var(--line); }
.top-actions { display:flex; align-items:center; gap:17px; }
.offline { color:var(--muted); font-size:10px; letter-spacing:1.2px; display:flex; align-items:center; gap:7px; }
.dot { width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; }
.icon-btn { display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; padding:0; border:1px solid var(--line); border-radius:50%; background:none; color:var(--muted); transition:background .15s,color .15s; }
.icon-btn:hover:not(:disabled) { background:var(--surface2); color:var(--ink); }
.icon-btn svg { width:19px; height:19px; }
.hero { display:flex; align-items:flex-end; justify-content:space-between; gap:32px; padding:44px 0 31px; }
.eyebrow { color:var(--muted); font-size:10px; letter-spacing:2px; font-weight:500; margin:0 0 14px; }
h1 { font-size:clamp(44px,5vw,64px); font-weight:600; line-height:1.035; letter-spacing:-3.8px; margin:0; }
h1 .accent { color:var(--accent); }
.hero-copy { font-size:14px; color:var(--muted); line-height:1.65; margin:15px 0 0; }
.hero-side { display:flex; align-items:center; gap:18px; padding:0 4px 8px 0; }
.orbit { width:81px; height:81px; border:1px solid var(--line); border-radius:50%; display:grid; place-items:center; position:relative; transform:rotate(-12deg); }
.orbit:before { content:''; width:102px; height:35px; border:1px solid var(--line); border-radius:50%; position:absolute; transform:rotate(-30deg); }
.orbit:after { content:''; width:7px; height:7px; background:var(--accent); border-radius:50%; position:absolute; left:-9px; top:51px; box-shadow:0 0 20px #d2fa6920; }
.orbit span { font-family:'JetBrains Mono',monospace; font-size:25px; color:var(--accent); font-weight:500; transform:rotate(12deg); }
.hero-side-copy { font-size:12px; color:var(--muted); line-height:1.65; }
.hero-side-copy strong { color:var(--ink); font-weight:500; }
.workspace { display:grid; grid-template-columns: minmax(0,.8fr) minmax(0,1.2fr); gap:24px; align-items:start; }
.source-stack { min-width:0; }
.source-card { background:var(--surface); border:1px solid #56643d; border-radius:26px; padding:23px 23px 13px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
html[data-theme="light"] .source-card { border-color:#b1c879; }
.label-row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.section-label { font-size:10px; letter-spacing:1.65px; color:var(--muted); font-weight:500; }
.base-label { color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.5px; background:var(--surface2); padding:5px 8px; border-radius:6px; }
.base-chips { display:flex; gap:7px; margin-top:18px; }
.base-chip { flex:1; min-width:0; min-height:48px; border:1px solid transparent; background:var(--surface2); border-radius:12px; display:flex; align-items:center; justify-content:center; gap:6px; color:var(--muted); font-size:11px; font-weight:600; }
.base-chip small { font-family:'JetBrains Mono',monospace; font-size:9px; opacity:.6; }
.base-chip:hover { border-color:var(--line); color:var(--ink); }
.base-chip.selected { background:var(--lime); color:#182012; border-color:var(--lime); }
.base-chip.more { flex:0 0 44px; }
.base-chip.more svg { width:20px; }
.input-row { display:flex; align-items:center; gap:10px; min-height:105px; margin-top:8px; }
.number-input { width:100%; min-width:0; border:0; background:none; color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:57px; font-weight:600; letter-spacing:-2px; outline:none; padding:9px 0; line-height:1.2; border-radius:4px; }
.number-input:focus-visible { outline:none; }
.input-row:focus-within { box-shadow:0 1px 0 var(--accent); }
.number-input::placeholder { font-size:25px; letter-spacing:-1px; color:var(--dim); font-weight:400; }
.input-row .icon-btn { border:0; flex-shrink:0; }
.input-row .icon-btn svg { width:17px; }
.editing-results { display:none; gap:8px; overflow-x:auto; padding-top:12px; scrollbar-width:none; }
.quick-result { flex:0 0 128px; min-height:69px; border:0; border-radius:12px; background:var(--surface2); padding:10px; text-align:left; }
.quick-top { display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:9px; }
.quick-top svg { width:12px; height:12px; }
.quick-value { display:block; font-family:'JetBrains Mono',monospace; font-size:19px; margin-top:7px; white-space:nowrap; overflow-x:auto; color:var(--ink); }
.quick-result.binary .quick-value { color:var(--blue); }
.quick-result.hex .quick-value { color:var(--pink); }
.quick-result.decimal .quick-value { color:var(--accent); }
.input-help { border-top:1px solid var(--line); padding-top:12px; color:var(--muted); font-size:10px; line-height:1.55; min-height:29px; }
.input-help.error { color:var(--error); }
.source-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; }

<script>/* Ideal Boolean/edge models; no propagation delay, analog voltage or metastability. */
(()=>{'use strict';
 const catalog=typeof module!=='undefined'&&module.exports?require('./logic-catalog.js'):window.RadixLogicCatalog;
 const need=(condition,text)=>{if(!condition)throw Error(text);};
 function gate(kind,inputs){need(catalog.gates.some(g=>g.id===kind),'Unknown gate');need(Array.isArray(inputs)&&inputs.every(x=>typeof x==='boolean')&&inputs.length>=1&&inputs.length<=4&&(['NOT','BUFFER'].includes(kind)===(inputs.length===1)),'NOT/BUFFER need one input; other gates need 2–4');switch(kind){case 'AND':return inputs.every(Boolean);case 'OR':return inputs.some(Boolean);case 'NOT':return !inputs[0];case 'BUFFER':return inputs[0];case 'NAND':return !inputs.every(Boolean);case 'NOR':return !inputs.some(Boolean);case 'XOR':return inputs.filter(Boolean).length%2===1;case 'XNOR':return inputs.filter(Boolean).length%2===0;}}

 function initial(s){return {bits:s.id==='RING_4'?1:0,clock:false};}
 function defaultInputs(s){switch(s.id){case 'SR_NAND':case 'JK_FF':return [true,true];case 'D_LATCH':return [true,false];case 'D_FF':case 'T_FF':return [true];case 'COUNTER_3':case 'RING_4':case 'JOHNSON_4':return [true,false];case 'SHIFT_4':return [true,true,false];default:return Array(s.inputs.length).fill(false);}}
 const forbidden=(s,i)=>['SR_NOR','SR_FF'].includes(s.id)?i[0]&&i[1]:s.id==='SR_NAND'?!i[0]&&!i[1]:false;
 function update(s,previous,inputs,clock){need(catalog.sequential.some(x=>x.id===s.id),'Unknown sequential model');need(inputs.length===s.inputs.length&&inputs.every(x=>typeof x==='boolean'),'Input dimension/type');need(previous.bits===null||(Number.isInteger(previous.bits)&&previous.bits>=0&&previous.bits<(1<<s.width)),'State outside width');need(typeof clock==='boolean'&&typeof previous.clock==='boolean','Clock must be Boolean');const nextClock=s.clocked?clock:false;if(s.clocked&&(previous.clock||!clock))return {...previous,clock:nextClock};const q=previous.bits,a=inputs[0],b=inputs[1]||false;const sr=(set,reset)=>set&&reset?null:set?1:reset?0:q;let next=q;switch(s.id){case 'SR_NOR':case 'SR_FF':next=sr(a,b);break;case 'SR_NAND':next=sr(!a,!b);break;case 'D_LATCH':next=b?Number(a):q;break;case 'D_FF':next=Number(a);break;case 'JK_FF':next=a&&b?(q===null?null:q^1):a?1:b?0:q;break;case 'T_FF':next=a?(q===null?null:q^1):q;break;case 'COUNTER_3':next=b?0:a?(q===null?null:(q+1)&7):q;break;case 'SHIFT_4':next=inputs[2]?0:b?(q===null?null:((q<<1)|Number(a))&15):q;break;case 'RING_4':next=b?1:a?(q===null?null:((q<<1)|(q>>3))&15):q;break;case 'JOHNSON_4':next=b?0:a?(q===null?null:((q<<1)|((q>>3)^1))&15):q;break;}return {bits:next,clock:nextClock};}
 function outputs(s,state,inputs){if(s.id==='SR_NOR'&&forbidden(s,inputs))return [0,0];if(s.id==='SR_NAND'&&forbidden(s,inputs))return [1,1];if(s.width===1)return [state.bits,state.bits===null?null:state.bits^1];return Array.from({length:s.width},(_,i)=>state.bits===null?null:(state.bits>>(s.width-1-i))&1);}

})();

<script>/* Offline SVG schematics. Pin junctions have dots; crossing wires without dots do not connect. */
(()=>{'use strict';

 function gate(kind,values,out){const h=190,n=values.length,x=140,y=68;let s='';values.forEach((v,i)=>{const iy=35+i*(120/Math.max(1,n-1)),py=y+(i+1)*52/(n+1);s+=text(14,iy+4,String.fromCharCode(65+i)) + text(48,iy+4,Number(v),14,tone(v))+line(63,iy,x+(['OR','NOR','XOR','XNOR'].includes(kind)?7:0),py,v);});s+=symbol(kind,x,y)+text(x+24,y+76,kind,10,'var(--muted)','middle');const ox=x+outX(kind);s+=line(ox,y+26,260,y+26,out)+dot(ox,y+26,out)+text(270,y+31,'Y='+Number(out),16,tone(out));return shell(320,h,kind+' gate diagram',s);}
 function layout(c){const depths=Object.fromEntries(c.inputs.map(n=>[n,0]));for(const n of c.nodes)depths[n.id]=1+Math.max(...n.refs.map(r=>depths[r]));const depth=Math.max(...Object.values(depths)),counts={};for(const n of c.nodes)counts[depths[n.id]]=(counts[depths[n.id]]||0)+1;const h=Math.max(240,c.inputs.length*42+30,...Object.values(counts).map(n=>n*88+30)),w=(depth+1)*150+80;const positions={};c.inputs.forEach((n,i)=>positions[n]={x:50,y:30+(i+.5)*(h-60)/c.inputs.length});const used={};for(const n of c.nodes){const d=depths[n.id],i=used[d]||0;used[d]=i+1;positions[n.id]={x:50+d*150,y:30+(i+.5)*(h-60)/counts[d],kind:n.gate};}return {w,h,positions};}
 function circuit(c,result,expanded=false){if(!expanded)return block(c.title,c.inputs,Object.keys(c.outputs),c.inputs.map(n=>Number(result.signals[n])),Object.values(result.outputs).map(Number),false);const {w,h,positions}=layout(c);let wires='',s='';c.nodes.forEach(n=>{const p=positions[n.id];n.refs.forEach((ref,i)=>{const from=positions[ref],fx=from.kind?from.x+outX(from.kind):from.x;const targetY=p.y-26+(i+1)*52/(n.refs.length+1);wires+=line(fx,from.y,p.x+(['OR','NOR','XOR','XNOR'].includes(n.gate)?7:0),targetY,result.signals[ref])+dot(fx,from.y,result.signals[ref]);});s+=symbol(n.gate,p.x,p.y-26)+text(p.x+26,p.y+45,n.gate+' · '+n.id,10,'var(--muted)','middle');});c.inputs.forEach(n=>{const p=positions[n];s+=text(8,p.y+4,n)+text(48,p.y-9,Number(result.signals[n]),11,tone(result.signals[n]));});Object.entries(c.outputs).forEach(([name,ref],i)=>{const from=positions[ref],y=35+(i+.5)*(h-70)/Object.keys(c.outputs).length;wires+=line(from.kind?from.x+outX(from.kind):from.x,from.y,w-60,y,result.outputs[name]);s+=text(w-52,y+4,name+'='+Number(result.outputs[name]),11,tone(result.outputs[name]));});return shell(w,h,c.title+' gate-level circuit',wires+s,'Gate-level implementation. Sweep horizontally to inspect every gate. Only dotted junctions connect crossing wires.');}
 function block(title,ins,outs,ivals,ovals,clocked,clock=false){const w=320,h=Math.max(200,Math.max(ins.length,outs.length+(clocked?1:0))*32+60),top=38,bottom=h-30;let s=`<rect x="122" y="24" width="91" height="${h-49}" rx="12" fill="var(--surface2)" stroke="var(--line)" stroke-width="1.5"/>`;const label=title.replace(' · enable','').replace(' · NOR','').replace(' · NAND','').split(' ');label.reduce((y,word)=>{s+=text(166,y,word,10,'var(--ink)','middle');return y+15;},Math.max(55,h/2-label.length*7));ins.forEach((n,i)=>{const y=top+(i+.5)*(bottom-top-(clocked?40:0))/ins.length;s+=text(10,y+4,n,10)+text(65,y-7,ivals[i]===null?'X':ivals[i],10,tone(ivals[i]))+line(73,y,122,y,ivals[i]);});outs.forEach((n,i)=>{const y=top+(i+.5)*(bottom-top)/outs.length;s+=line(213,y,252,y,ovals[i])+text(260,y+4,n+'='+ (ovals[i]===null?'X':ovals[i]),10,tone(ovals[i]));});if(clocked)s+=line(78,h-49,122,h-49,Number(clock))+`<path d="M122 ${h-55} l9 6 -9 6" stroke="var(--ink)" fill="none" stroke-width="1.5"/>`+text(77,h-45,'CLK↑',9);return shell(w,h,title+' block diagram',s);}
 function sequential(spec,state,inputs,outputs,expanded=false){const labels=spec.width===1?['Q',"Q'"]:Array.from({length:spec.width},(_,i)=>'Q'+(spec.width-1-i));if(expanded&&['SR_NOR','SR_NAND'].includes(spec.id)){const nand=spec.id==='SR_NAND',kind=nand?'NAND':'NOR',topName=nand?'nS':'R',lowName=nand?'nR':'S',topVal=inputs[nand?0:1],lowVal=inputs[nand?1:0];let s='';s+=line(65,52,145+(nand?0:7),48+52/3,topVal)+line(65,164,145+(nand?0:7),160+52/3,lowVal);s+=text(10,56,topName)+text(10,168,lowName);s+=symbol(kind,145,48)+symbol(kind,145,160);const ox=145+outX(kind);s+=`<path d="M${ox} 74 H290 V${160+104/3} H${145+(nand?0:7)}" fill="none" stroke="${tone(outputs[0])}" stroke-width="2"/><path d="M${ox} 186 H310 V${48+104/3} H${145+(nand?0:7)}" fill="none" stroke="${tone(outputs[1])}" stroke-width="2"/>`;s+=line(ox,74,257,74,outputs[0])+line(ox,186,257,186,outputs[1])+dot(ox,74,outputs[0])+dot(ox,186,outputs[1])+text(240,59,'Q='+ (outputs[0]===null?'X':outputs[0]),11,tone(outputs[0]))+text(240,213,"Q'="+(outputs[1]===null?'X':outputs[1]),11,tone(outputs[1]));return shell(330,250,spec.title+' cross-coupled diagram',s,'NOR Q gate is driven by R; NAND Q gate is driven by nS. Feedback wires connect only at dotted junctions.');}return block(spec.title,spec.inputs,labels,inputs.map(Number),outputs,spec.clocked,state.clock);}
 function timing(spec,history){const samples=history.slice(-12),labels=[...(spec.clocked?['CLK']:[]),...spec.inputs,...(spec.width===1?['Q',"Q'"]:Array.from({length:spec.width},(_,i)=>'Q'+(spec.width-i-1)))],w=Math.max(320,60+samples.length*42),h=40+labels.length*42;let s='';for(let r=0;r<labels.length;r++){const name=labels[r],base=40+r*42;s+=text(8,base,name,10);let prev=null;samples.forEach((sample,i)=>{let v;if(name==='CLK')v=Number(sample.clock);else if(spec.inputs.includes(name))v=Number(sample.inputs[spec.inputs.indexOf(name)]);else v=sample.outputs[name==="Q'"?1:name==='Q'?0:spec.width-1-Number(name.slice(1))];const x=53+i*42,y=v===null?base-5:v?base-15:base+4;if(i>0&&prev!==null&&v!==null)s+=`<path d="M${x} ${prev} V${y}" stroke="${tone(v)}" stroke-width="1.6"/>`;s+=`<path d="M${x} ${y} h42" stroke="${tone(v)}" stroke-width="1.8" ${v===null?'stroke-dasharray="3 3"':''}/>`;if(v===null)s+=text(x+15,y-3,'X',9,'var(--pink)');prev=v===null?null:y;if(r===0)s+=text(x+19,15,sample.tick,9,'var(--dim)','middle');});}return shell(w,h,'Discrete timing trace',s,'Each column is an action sample, not real time. Rising clock edges capture flip-flop inputs; X is unknown.');}
 const api={gate,circuit,sequential,timing,layout,symbol,block};if(typeof module!=='undefined'&&module.exports)module.exports=api;if(typeof window!=='undefined')window.RadixDiagrams=api;

<script>(()=>{const data=[{"id":"gate-and","category":"Gates","tier":0,"title":"Every input matters","prompt":"AND: A=1, B=0. What is Y?","choices":["0","1"],"answer":0,"hint":"AND needs all inputs high.","explanation":"One input is 0, so A·B is 0."},{"id":"gate-or","category":"Gates","tier":0,"title":"At least one","prompt":"OR: A=0, B=0. What is Y?","choices":["1","0"],"answer":1,"hint":"OR needs at least one 1.","explanation":"Neither input is 1, so Y=0."},{"id":"gate-not","category":"Gates","tier":0,"title":"Flip the value","prompt":"NOT: A=1. What is Y?","choices":["0","1"],"answer":0,"hint":"An output bubble means inversion.","explanation":"NOT reverses 1 to 0."},{"id":"gate-nand","category":"Gates","tier":0,"title":"AND, then invert","prompt":"NAND: A=1, B=1. What is Y?","choices":["1","0"],"answer":1,"hint":"First evaluate AND.","explanation":"AND produces 1; NAND inverts it to 0."},{"id":"gate-nor","category":"Gates","tier":0,"title":"OR, then invert","prompt":"NOR: A=0, B=0. What is Y?","choices":["0","1"],"answer":1,"hint":"First evaluate OR.","explanation":"OR produces 0; NOR inverts it to 1."},{"id":"gate-xor","category":"Gates","tier":1,"title":"Odd means one","prompt":"Three-input XOR: A=B=C=1. What is Y?","choices":["0","1"],"answer":1,"hint":"Count the number of 1s, not whether exactly one is high.","explanation":"Three 1s is odd parity, so Y=1. Multi-input XOR is not an exactly-one detector."},{"id":"gate-xnor","category":"Gates","tier":1,"title":"Even means one","prompt":"Four-input XNOR: all four inputs are 1. What is Y?","choices":["1","0"],"answer":0,"hint":"XNOR is the complement of XOR.","explanation":"Four 1s is even parity, so XNOR produces 1."},{"id":"gate-buffer","category":"Gates","tier":0,"title":"Pass it through","prompt":"BUFFER: A=0. What is Y?","choices":["1","0"],"answer":1,"hint":"A buffer does not invert.","explanation":"The output follows its one input: Y=0."},{"id":"comb-half-add","category":"Circuits","tier":0,"title":"Two ones make two","prompt":"Half adder: A=1, B=1. Give Sum, Carry.","choices":["1, 0","0, 1","1, 1","0, 0"],"answer":1,"hint":"Write decimal 2 as a two-bit result.","explanation":"1+1=2=10₂. Sum is the low bit 0; Carry is the high bit 1."},{"id":"comb-full-add","category":"Circuits","tier":1,"title":"Remember carry-in","prompt":"Full adder: A=B=Cin=1. Give Sum, Cout.","choices":["0, 1","1, 0","1, 1","0, 0"],"answer":2,"hint":"The total is 3, not 2.","explanation":"1+1+1=3=11₂: Sum=1 and Cout=1."},{"id":"comb-half-sub","category":"Circuits","tier":1,"title":"Borrow one","prompt":"Half subtractor: A=0, B=1. Give Difference, Borrow.","choices":["1, 1","1, 0","0, 1","0, 0"],"answer":0,"hint":"0−1 needs a borrow from the next position.","explanation":"After borrowing 2, 2−1=1; Difference=1 and Borrow=1."},{"id":"comb-full-sub","category":"Circuits","tier":2,"title":"Borrow-in counts too","prompt":"Full subtractor: A=0, B=1, Bin=1. Give Difference, Bout.","choices":["1, 1","0, 0","1, 0","0, 1"],"answer":3,"hint":"Compute A−B−Bin.","explanation":"0−1−1=−2. At one bit, Difference=0 and Borrow=1."},{"id":"comb-mux","category":"Circuits","tier":1,"title":"Read the selector","prompt":"4:1 MUX: D0=0, D1=0, D2=1, D3=0; S1S0=10. Y?","choices":["0","1"],"answer":1,"hint":"10₂ selects input number 2.","explanation":"The MUX routes D2, which is 1. It does not OR all data inputs."},{"id":"comb-encoder","category":"Circuits","tier":2,"title":"The highest input wins","prompt":"Priority encoder: D3=D2=D1=D0=1. Give Y1Y0 and Valid.","choices":["00 / 1","11 / 1","11 / 0","00 / 0"],"answer":1,"hint":"Priority is D3 > D2 > D1 > D0.","explanation":"D3 wins, so its index is 11₂; at least one input is high, so Valid=1."},{"id":"comb-ripple","category":"Circuits","tier":1,"title":"Keep the fifth bit","prompt":"4-bit adder: 1111 + 0001, Cin=0. Give S3S2S1S0 and Cout.","choices":["1111 / 0","0001 / 1","0000 / 1","0000 / 0"],"answer":2,"hint":"15+1=16 needs five bits.","explanation":"The result is 10000₂. The low four sum bits are 0000 and Cout=1."},{"id":"comb-compare","category":"Circuits","tier":1,"title":"Start at the MSB","prompt":"2-bit comparator: A=10, B=01. Which relation is true?","choices":["A < B","A = B","A > B"],"answer":2,"hint":"10₂ is decimal 2, not decimal ten.","explanation":"A=2 and B=1, so only A>B is high."},{"id":"memory-d-hold","category":"Memory","tier":1,"title":"High is not an edge","prompt":"D flip-flop: Q=1, CLK stays high, D changes to 0. Q next?","choices":["0","1","X"],"answer":1,"hint":"Capture needs a 0→1 transition.","explanation":"No new rising edge occurs. Q holds 1 even though D is now 0."},{"id":"memory-latch","category":"Memory","tier":0,"title":"A latch follows a level","prompt":"D latch: Q=0, EN=1, D becomes 1. Q next?","choices":["0","1","X"],"answer":1,"hint":"An enabled D latch is transparent.","explanation":"EN=1 lets Q follow D immediately. No clock edge is required."},{"id":"memory-jk","category":"Memory","tier":1,"title":"Toggle, do not set","prompt":"JK flip-flop: Q=1, J=K=1 at a rising edge. Q next?","choices":["1","0","X"],"answer":1,"hint":"Both high means toggle.","explanation":"JK=11 toggles Q from 1 to 0. It is valid in this ideal edge model."},{"id":"memory-t","category":"Memory","tier":1,"title":"No second capture","prompt":"T flip-flop: Q=1, T=1, CLK stays high. Q next?","choices":["0","X","1"],"answer":2,"hint":"A high level is not another rising edge.","explanation":"Q remains 1. T toggles only at each new rising edge."},{"id":"memory-sr-nor","category":"Memory","tier":1,"title":"Forbidden does not mean complementary","prompt":"NOR SR latch: S=R=1. What happens?","choices":["Q=1, Q′=0","Q=0, Q′=1","Q=0, Q′=0; memory X","Q=1, Q′=1; memory X"],"answer":2,"hint":"NOR outputs are forced low by a high reset/set input.","explanation":"Both physical outputs are 0; stored memory is indeterminate. Simultaneous release to hold keeps X until valid recovery."},{"id":"memory-sr-nand","category":"Memory","tier":2,"title":"Active-low changes the rule","prompt":"NAND SR latch: nS=nR=0. What happens?","choices":["Q=0, Q′=0; memory X","Q=1, Q′=1; memory X","Q=1, Q′=0","Q=0, Q′=1"],"answer":1,"hint":"A 0 on either NAND input forces its output to 1.","explanation":"Both physical outputs are 1 and stored memory is indeterminate. The active-low hold combination is 11."},{"id":"memory-counter","category":"Memory","tier":1,"title":"Wrap at the width","prompt":"3-bit counter: Q=111, EN=1, RESET=0. After one rising edge?","choices":["000","111","100","X"],"answer":0,"hint":"There are eight states, 0 through 7.","explanation":"The next count is (7+1) mod 8 = 0, so Q=000."},{"id":"memory-shift","category":"Memory","tier":1,"title":"Insert at Q0","prompt":"Shift register: Q3Q2Q1Q0=0110, D=1, EN=1, RESET=0. Next edge?","choices":["1011","1101","0011","0111"],"answer":1,"hint":"Move each bit toward Q3; D enters Q0.","explanation":"Q3←Q2, Q2←Q1, Q1←Q0, Q0←D produces 1101."},{"id":"memory-sr-ff","category":"Memory","tier":2,"title":"Clocked forbidden state","prompt":"SR flip-flop: Q=1, S=R=1 at a rising edge. Q next?","choices":["1","0","X"],"answer":2,"hint":"The forbidden combination is captured on the edge.","explanation":"This ideal SR flip-flop stores unknown X after capturing 11. A valid set/reset edge recovers a known state."},{"id":"memory-ring","category":"Memory","tier":1,"title":"Circulate the one","prompt":"Ring counter: Q=1000, EN=1, RESET=0. Next rising edge?","choices":["0000","0001","0010","1111"],"answer":1,"hint":"The old Q3 bit wraps around to Q0.","explanation":"Rotate 1000 left: the high bit re-enters at Q0, giving 0001."},{"id":"memory-johnson","category":"Memory","tier":2,"title":"Invert the feedback","prompt":"Johnson counter: Q=1111, EN=1, RESET=0. Next rising edge?","choices":["1110","0000","0111","0001"],"answer":0,"hint":"The complemented old Q3 enters Q0.","explanation":"Shift left and insert NOT old Q3 = 0: the next state is 1110."},{"id":"memory-reset","category":"Memory","tier":1,"title":"Reset wins over enable","prompt":"3-bit counter: Q=101, EN=0, RESET=1. After a rising edge?","choices":["101","110","000","X"],"answer":2,"hint":"RESET is synchronous and takes priority over EN.","explanation":"At the edge, RESET=1 clears Q to 000 even though EN=0. Before the edge it would still hold 101."},{"id":"rep-negative","category":"Representations","tier":1,"title":"Not signed magnitude","prompt":"Encode −13 in 8-bit two’s complement.","choices":["10001101","11110010","11110011","00001101"],"answer":2,"hint":"Encode +13, invert every bit, then add 1.","explanation":"+13=00001101; invert→11110010; add 1→11110011. Signed magnitude 10001101 is a different representation."},{"id":"rep-range","category":"Representations","tier":0,"title":"The upper endpoint","prompt":"Largest unsigned 8-bit integer?","choices":["127","128","255","256"],"answer":2,"hint":"There are 2^8 possible words, starting at zero.","explanation":"The range is 0 through 2^8−1 = 255. Signed two’s complement instead ends at 127."},{"id":"rep-gray","category":"Representations","tier":1,"title":"Neighboring codes","prompt":"Gray code for the 4-bit binary word 0100?","choices":["0100","0110","1100","0010"],"answer":1,"hint":"XOR binary with itself shifted right one bit.","explanation":"0100 XOR 0010 = 0110. Gray code is not positional binary."},{"id":"rep-bcd","category":"Representations","tier":0,"title":"One nibble per digit","prompt":"BCD encoding of decimal 12?","choices":["0001 0010","0000 1100","1100 0000","0010 0001"],"answer":0,"hint":"Encode the decimal digits 1 and 2 separately.","explanation":"BCD is 0001 0010. Ordinary binary for decimal 12 is 1100; these are different encodings."},{"id":"expr-demorgan","category":"Expressions","tier":1,"title":"Invert the whole product","prompt":"Which expression equals NOT (A AND B)?","choices":["A′ AND B′","A′ OR B′","A OR B","A AND B"],"answer":1,"hint":"De Morgan changes AND to OR when distributing NOT.","explanation":"NOT (A·B)=A′+B′. Inverting only the variables but keeping AND is incorrect."},{"id":"expr-precedence","category":"Expressions","tier":1,"title":"Multiplication first","prompt":"In A + BC, which operation happens first?","choices":["A OR B","B AND C","A AND B","All are left-to-right"],"answer":1,"hint":"Adjacency is AND and binds more tightly than OR.","explanation":"A + BC means A OR (B AND C), not (A OR B) AND C."},{"id":"expr-xor","category":"Expressions","tier":1,"title":"Different inputs","prompt":"Which equals A XOR B?","choices":["AB + A′B′","A′B + AB′","A+B","AB"],"answer":1,"hint":"XOR is true when the two inputs differ.","explanation":"A′B + AB′ covers 01 and 10 only. AB + A′B′ is XNOR instead."},{"id":"expr-constant","category":"Expressions","tier":0,"title":"One dominates OR","prompt":"Simplify 1 OR (A AND B).","choices":["AB","0","1","A+B"],"answer":2,"hint":"OR with 1 is always high.","explanation":"Every truth-table row is 1. Both SOP and POS reduce to constant 1."},{"id":"base-place","category":"Number bases","tier":0,"title":"Weights, not digits","prompt":"Binary 1011 equals which decimal?","choices":["11","13","10","7"],"answer":0,"hint":"Add the weights 8, 4, 2, 1 where bits are 1.","explanation":"1×8 + 0×4 + 1×2 + 1×1 = 11."},{"id":"base-hex-digit","category":"Number bases","tier":0,"title":"Letters are digits too","prompt":"Hex digit C equals which decimal?","choices":["12","13","11","14"],"answer":0,"hint":"A=10, B=11, C=12.","explanation":"C is the third letter-digit: 12."},{"id":"base-oct-group","category":"Number bases","tier":1,"title":"Three bits at a time","prompt":"Binary 101110 equals which octal?","choices":["56","46","35","72"],"answer":0,"hint":"Group from the right: 101 110.","explanation":"101₂=5 and 110₂=6, so the answer is 56₈."},{"id":"base-hex-group","category":"Number bases","tier":1,"title":"Four bits at a time","prompt":"Binary 1111011 equals which hex?","choices":["7B","FB","3D","E7"],"answer":0,"hint":"Pad left to full nibbles: 0111 1011.","explanation":"0111₂=7 and 1011₂=B, so the answer is 7B₁₆."},{"id":"base-frac","category":"Number bases","tier":2,"title":"Halves, quarters, eighths","prompt":"Binary 0.101 equals which decimal?","choices":["0.625","0.5","0.101","0.75"],"answer":0,"hint":"Fraction weights are 1/2, 1/4, 1/8.","explanation":"0.5 + 0 + 0.125 = 0.625."},{"id":"gh-market","category":"Number bases","tier":0,"title":"Oranges at Makola","prompt":"Adwoa sells 12 oranges at 2 cedis each. The total in binary is?","choices":["11000","10100","11100","10010"],"answer":0,"hint":"First multiply in decimal: 12 × 2.","explanation":"24₁₀ = 16 + 8 = 11000₂."},{"id":"gh-trotro","category":"Number bases","tier":1,"title":"Free seats","prompt":"A trotro has 18 seats and 9 are taken. Free seats in octal?","choices":["11","9","21","10"],"answer":0,"hint":"18 − 9 free seats, then convert.","explanation":"9₁₀ = 1×8 + 1 = 11₈."},{"id":"base-den-hex","category":"Number bases","tier":1,"title":"The byte boundary","prompt":"Decimal 255 in hexadecimal?","choices":["FF","FE","100","EE"],"answer":0,"hint":"Divide by 16: quotient and remainder.","explanation":"255 = 15×16 + 15, so FF₁₆."},{"id":"base-why-hex","category":"Number bases","tier":0,"title":"Why hex exists","prompt":"Why do programmers write FF instead of 11111111?","choices":["Shorter, same bits","Different value","It is decimal","It is text"],"answer":0,"hint":"Count the bits each form carries.","explanation":"One hex digit packs exactly 4 bits, so FF is 11111111 written compactly."},{"id":"exam-base-table","category":"Number bases","tier":2,"title":"Spot the wrong row","prompt":"Which DEC/OCT/HEX row is wrong?","choices":["15 / 17 / F","16 / 20 / 10","9 / 11 / 9","12 / 14 / D"],"answer":3,"hint":"Check each row: 12 decimal is C, not D, in hex.","explanation":"12₁₀ = 14₈ but C₁₆. D₁₆ is 13₁₀, so the last row is wrong."},{"id":"arith-add-bin","category":"Arithmetic","tier":0,"title":"Carry the one","prompt":"1011₂ + 0111₂ = ?","choices":["10010","10001","10100","10000"],"answer":0,"hint":"11 + 7 in decimal, then convert.","explanation":"18₁₀ = 10010₂. The leftmost 1 is the final carry."},{"id":"arith-sub-bin","category":"Arithmetic","tier":1,"title":"Borrow with care","prompt":"1011₂ − 0111₂ = ?","choices":["0100","0011","0101","1000"],"answer":0,"hint":"11 − 7 in decimal, then convert.","explanation":"4₁₀ = 0100₂."},{"id":"arith-add-hex","category":"Arithmetic","tier":1,"title":"Letters add too","prompt":"2A₁₆ + 15₁₆ = ?","choices":["3F","3E","45","40"],"answer":0,"hint":"A=10: 2A is 42, 15 is 21.","explanation":"42 + 21 = 63 = 3F₁₆."},{"id":"arith-sub-oct","category":"Arithmetic","tier":1,"title":"Borrow an eight","prompt":"52₈ − 27₈ = ?","choices":["23","25","31","20"],"answer":0,"hint":"Convert: 42 − 23 in decimal.","explanation":"19₁₀ = 23₈."},{"id":"arith-mul-bin","category":"Arithmetic","tier":2,"title":"Shift and add","prompt":"101₂ × 11₂ = ?","choices":["1111","1011","1101","1110"],"answer":0,"hint":"5 × 3 in decimal, then convert.","explanation":"15₁₀ = 1111₂."},{"id":"arith-div-bin","category":"Arithmetic","tier":2,"title":"Divide the magnitudes","prompt":"1100₂ ÷ 100₂ = ?","choices":["11 rem 0","10 rem 0","11 rem 1","100 rem 0"],"answer":0,"hint":"12 ÷ 4 in decimal.","explanation":"3₁₀ = 11₂ with remainder 0."},{"id":"gh-money-arith","category":"Arithmetic","tier":1,"title":"Change in binary","prompt":"Kwame pays 45 cedis with 18 cedis spent. Change in binary?","choices":["11011","11001","11101","10111"],"answer":0,"hint":"45 − 18 in decimal first.","explanation":"27₁₀ = 16+8+2+1 = 11011₂."},{"id":"arith-carry","category":"Arithmetic","tier":0,"title":"One plus one","prompt":"1 + 1 in binary = ?","choices":["10","1","11","0"],"answer":0,"hint":"Binary has no digit 2.","explanation":"1 + 1 = 10₂: write 0, carry 1."},{"id":"exam-arith-hex","category":"Arithmetic","tier":2,"title":"The famous overflow","prompt":"FF₁₆ + 1 = ?","choices":["100","FF0","FE","1000"],"answer":0,"hint":"255 + 1 needs one more digit.","explanation":"256₁₀ = 100₁₆."},{"id":"arith-borrow","category":"Arithmetic","tier":1,"title":"Borrow across zeros","prompt":"1000₂ − 0001₂ = ?","choices":["0111","0110","1001","1111"],"answer":0,"hint":"8 − 1 in decimal.","explanation":"7₁₀ = 0111₂."},{"id":"law-identity","category":"Laws","tier":0,"title":"Add nothing","prompt":"A + 0 = ?","choices":["A","0","1","A′"],"answer":0,"hint":"OR with 0 never forces a 1.","explanation":"Identity: A + 0 = A."},{"id":"law-null","category":"Laws","tier":0,"title":"Multiply by nothing","prompt":"A · 0 = ?","choices":["0","A","1","A′"],"answer":0,"hint":"AND with 0 never allows a 1.","explanation":"Null law: A · 0 = 0."},{"id":"law-idem","category":"Laws","tier":0,"title":"Same twice","prompt":"A + A = ?","choices":["A","1","0","2A"],"answer":0,"hint":"Repeating an OR term adds no new 1s.","explanation":"Idempotent: A + A = A."},{"id":"law-complement","category":"Laws","tier":1,"title":"Cover everything","prompt":"A + A′ = ?","choices":["1","A","0","A′"],"answer":0,"hint":"One of A, A′ is always 1.","explanation":"Complement: A + A′ = 1."},{"id":"law-absorption","category":"Laws","tier":1,"title":"The vanishing term","prompt":"A + AB = ?","choices":["A","B","A+B","1"],"answer":0,"hint":"Factor: A(1 + B).","explanation":"Absorption: A + AB = A."},{"id":"law-absorption2","category":"Laws","tier":2,"title":"Absorb the other way","prompt":"A(A + B) = ?","choices":["A","AB","A+B","B"],"answer":0,"hint":"Distribute, then absorb.","explanation":"AA + AB = A + AB = A."},{"id":"law-demorgan-or","category":"Laws","tier":1,"title":"Break the bar","prompt":"(A + B)′ = ?","choices":["A′B′","A′+B′","AB","A+B"],"answer":0,"hint":"De Morgan flips OR to AND.","explanation":"(A + B)′ = A′ · B′."},{"id":"law-demorgan-and","category":"Laws","tier":1,"title":"Break the other bar","prompt":"(AB)′ = ?","choices":["A′+B′","A′B′","A+B","AB"],"answer":0,"hint":"De Morgan flips AND to OR.","explanation":"(AB)′ = A′ + B′."},{"id":"law-distributive","category":"Laws","tier":2,"title":"Factor like algebra","prompt":"A(B + C) = ?","choices":["AB+AC","(A+B)(A+C)","A+BC","ABC"],"answer":0,"hint":"AND distributes over OR.","explanation":"A(B + C) = AB + AC."},{"id":"exam-law-simplify","category":"Laws","tier":2,"title":"Factor, then collapse","prompt":"Simplify A′B + AB.","choices":["B","A","A′","1"],"answer":0,"hint":"Factor out B first.","explanation":"B(A′ + A) = B · 1 = B."},{"id":"kmap-gray","category":"K-maps","tier":0,"title":"Neighbors differ once","prompt":"Correct 2-bit Gray order?","choices":["00, 01, 11, 10","00, 01, 10, 11","00, 11, 01, 10","00, 10, 01, 11"],"answer":0,"hint":"Only one bit may change per step.","explanation":"00→01→11→10 changes one bit each step."},{"id":"kmap-group-size","category":"K-maps","tier":0,"title":"Powers of two","prompt":"Legal K-map group sizes on maps up to 6 variables?","choices":["1, 2, 4, 8, 16, 32, 64","Any even count","Multiples of 3","Any count"],"answer":0,"hint":"A map has at most 64 cells; legal groups stay powers of two.","explanation":"Only powers of two from 1 through 64 are legal on maps up to six variables."},{"id":"kmap-edges","category":"K-maps","tier":1,"title":"The map is a torus","prompt":"Left and right edges of a K-map…","choices":["touch (wrap around)","never touch","touch only in POS","touch only in 4-var"],"answer":0,"hint":"Gray code makes the edges adjacent.","explanation":"Opposite edges are neighbors, so groups may wrap around."},{"id":"kmap-sop-term","category":"K-maps","tier":1,"title":"Keep the fixed literal","prompt":"SOP group of four with B=1 fixed, rest varying. Term?","choices":["B","B′","1","A"],"answer":0,"hint":"Fixed 1 becomes the plain literal.","explanation":"Only B stays 1 everywhere in the group: term = B."},{"id":"kmap-pos-term","category":"K-maps","tier":2,"title":"POS flips the rule","prompt":"POS group of two zeroes with A=0 fixed. Clause?","choices":["A","A′","0","A+B"],"answer":0,"hint":"In POS, fixed 0 becomes the plain literal.","explanation":"Only A stays 0 on the zeroes: clause = (A)."},{"id":"kmap-xor2","category":"K-maps","tier":1,"title":"The checkerboard","prompt":"2-var map with 1s at m1, m2 simplifies to?","choices":["A⊕B","A⊙B","A+B","AB"],"answer":0,"hint":"The 1s sit on 01 and 10.","explanation":"A′B + AB′ = A ⊕ B."},{"id":"kmap-dontcare","category":"K-maps","tier":1,"title":"Xs are helpers","prompt":"Don’t-care cells…","choices":["may join groups but need no cover","must all be covered","always mean 0","are forbidden"],"answer":0,"hint":"Xs impose no output requirement.","explanation":"Use Xs to enlarge groups; uncovered Xs are fine."},{"id":"exam-kmap-essential","category":"K-maps","tier":2,"title":"Why this group stays","prompt":"A group is essential when…","choices":["it alone covers some required cell","it is the largest","it wraps an edge","it contains no Xs"],"answer":0,"hint":"Remove it: does some 1 lose cover?","explanation":"Essential groups cover a required cell no other maximal group covers."},{"id":"rep-ones","category":"Representations","tier":1,"title":"Flip, do not add","prompt":"One’s complement of 00001101 (8-bit)?","choices":["11110010","11110011","00001101","10001101"],"answer":0,"hint":"Invert every bit; no +1 step.","explanation":"Flipping all bits gives 11110010. Adding 1 would make two’s complement."},{"id":"rep-ones-zero","category":"Representations","tier":2,"title":"Two zeroes","prompt":"8-bit one’s complement: what is 11111111 worth?","choices":["-0","-1","-255","+255"],"answer":0,"hint":"Invert it back to read the magnitude.","explanation":"Inverting gives 00000000 with the sign bit set: negative zero, −0."},{"id":"rep-ones-vs-twos","category":"Representations","tier":1,"title":"Spot the +1","prompt":"One’s vs two’s complement of +5 (4-bit)?","choices":["1010 vs 1011","1011 vs 1010","0101 vs 1010","They match"],"answer":0,"hint":"+5 is 0101; flip for one’s, then +1 for two’s.","explanation":"One’s: 1010. Two’s: 1010 + 1 = 1011."},{"id":"gh-phone-bits","category":"Representations","tier":0,"title":"Bars on a phone","prompt":"Signal bars 0–3 stored in 2 bits. How many patterns?","choices":["4","3","2","8"],"answer":0,"hint":"Two bits count 00 to 11.","explanation":"2 bits hold 2² = 4 patterns: 00, 01, 10, 11."},{"id":"exam-rep-range","category":"Representations","tier":2,"title":"Signed limits","prompt":"8-bit two’s complement range?","choices":["−128…+127","−127…+128","0…255","−255…+255"],"answer":0,"hint":"Half the 256 words go negative.","explanation":"−2⁷ … +(2⁷−1) = −128 … +127."},{"id":"gh-traffic-nand","category":"Gates","tier":1,"title":"Sensors at the junction","prompt":"NAND with A=1, B=0 (traffic sensors). Y?","choices":["1","0","X","Z"],"answer":0,"hint":"AND first, then invert.","explanation":"AND gives 0; NAND inverts to 1."},{"id":"exam-mux-enable","category":"Circuits","tier":2,"title":"Build XOR from a MUX","prompt":"2:1 MUX for F=A′B+AB′. Choose S, D0, D1.","choices":["S=A, D0=B, D1=B′","S=B, D0=A, D1=A′","S=A, D0=A, D1=B","Impossible"],"answer":0,"hint":"F = S′D0 + SD1 must match A′B + AB′.","explanation":"With S=A: A′B + AB′ needs D0=B and D1=B′."},{"id":"exam-counter-states","category":"Memory","tier":1,"title":"Count the states","prompt":"How many states in a 3-bit binary counter?","choices":["8","6","7","3"],"answer":0,"hint":"Three bits count 000 to 111.","explanation":"2³ = 8 states."},{"id":"exam-jk-toggle","category":"Memory","tier":2,"title":"Set, not toggle","prompt":"JK: Q=0, J=1, K=0 at a rising edge. Q next?","choices":["1","0","X","Toggles"],"answer":0,"hint":"J=1, K=0 is the set combination.","explanation":"JK=10 sets Q to 1."},{"id":"exam-expr-nor","category":"Expressions","tier":2,"title":"Count the ones","prompt":"F=(A+B)′ has how many 1s in its 2-var table?","choices":["1","3","2","0"],"answer":0,"hint":"NOR is 1 only when both inputs are 0.","explanation":"Only row 00 gives 1: a single one."},{"id":"float-parts","category":"Floats","tier":0,"title":"Three fields","prompt":"A 32-bit float splits into sign, exponent and fraction. How many bits each?","choices":["1, 8, 23","1, 11, 52","8, 8, 16","1, 7, 24"],"answer":0,"hint":"They must add to 32; the exponent takes 8.","explanation":"Sign 1 + exponent 8 + fraction 23 = 32 bits. (1, 11, 52) is the 64-bit double."},{"id":"float-zero","category":"Floats","tier":0,"title":"All quiet","prompt":"All 32 bits of a float are 0. The value is?","choices":["+0","1.0","NaN","−1.0"],"answer":0,"hint":"Zero exponent plus zero fraction is the zero pattern.","explanation":"All-zero bits mean +0.0."},{"id":"float-sign-bit","category":"Floats","tier":0,"title":"The first bit","prompt":"A float whose sign bit is 1 is…?","choices":["negative","positive","always NaN","always zero"],"answer":0,"hint":"Bit 31 is the sign, not the magnitude.","explanation":"Sign 1 means negative (or −0)."},{"id":"sim-delay","category":"Builder","tier":0,"title":"Nothing is instant","prompt":"Propagation delay means…?","choices":["outputs change a little after inputs","outputs change before inputs","clocks run backwards","wires store charge"],"answer":0,"hint":"Gates need nanoseconds to switch.","explanation":"Every gate output follows its inputs after a small delay."},{"id":"builder-wire","category":"Builder","tier":0,"title":"One driver","prompt":"In the builder, a wire connects…?","choices":["one output to input pins","two outputs together","two probes","inputs to inputs"],"answer":0,"hint":"Signals flow from outputs to inputs.","explanation":"Each wire carries one output signal into input pins; the probe only observes."},{"id":"gh-score","category":"Arithmetic","tier":0,"title":"Derby goals","prompt":"Hearts score 2, Kotoko score 1. Total goals in binary?","choices":["11","10","101","3"],"answer":0,"hint":"2 + 1 goals, then convert.","explanation":"3₁₀ = 11₂."},{"id":"kmap-cells-3var","category":"K-maps","tier":0,"title":"Count the cells","prompt":"A 3-variable K-map has how many cells?","choices":["8","6", const Expression={parse,report:(source,n)=>{const e=parse(source,n),cells=Array.from({length:1<<n},(_,c)=>Number(e.evaluate(c))),minterms=cells.flatMap((v,i)=>v?[i]:[]),maxterms=cells.flatMap((v,i)=>v?[]:[i]);return {normalized:e.display(),cells,sop:K.solve(n,cells,'SOP').expression,pos:K.solve(n,cells,'POS').expression,minterms,maxterms,sigmaM:`Σm(${minterms.join(',')})`,piM:`ΠM(${maxterms.join(',')})`};},compare:(left,right,n)=>{const a=parse(left,n),b=parse(right,n),mismatches=Array.from({length:1<<n},(_,c)=>c).filter(c=>a.evaluate(c)!==b.evaluate(c));return {equivalent:mismatches.length===0,mismatches};}};

 else if(['bits','gray'].includes(mode)){const digits=text.replace(/[ _]/g,'');need(/^[01]+$/.test(digits),'Use only binary 0/1; spaces and underscores may group digits.');need(digits.length<=width,`The word has ${digits.length} bits; choose a width of at least that size.`);v=BigInt('0b'+digits);if(mode==='gray')v=grayDecode(v);if(digits.length<width)steps.push('Short words are ZERO-padded on the left, not sign-extended. Choose the original width when reading a negative word.');if(mode==='gray')steps.push('Decode Gray with cumulative XOR from the most significant bit. Gray is a code, not positional binary.');}

}};
class History{constructor(limit=32){need(Number.isInteger(limit)&&limit>=1&&limit<=128,'Invalid history limit.');this.limit=limit;this.past=[];this.future=[];}get canUndo(){return !!this.past.length;}get canRedo(){return !!this.future.length;}record(before,after){if(JSON.stringify(before)===JSON.stringify(after))return;this.past.push(structClone(before));this.past=this.past.slice(-this.limit);this.future=[];}undo(current){if(!this.canUndo)return null;this.future.push(structClone(current));return this.past.pop();}redo(current){if(!this.canRedo)return null;this.past.push(structClone(current));this.past=this.past.slice(-this.limit);return this.future.pop();}clear(){this.past=[];this.future=[];}}

function readJson(text){need(typeof text==='string'&&new TextEncoder().encode(text).length<=262144,'Backup exceeds 256 KiB.');let i=0,nodes=0;const error=msg=>{throw Error('Invalid backup JSON: '+msg+' at '+(i+1)+'.');},ws=()=>{while(/[ \r\n\t]/.test(text[i]||'~'))i++;};

function sessions(text){const out=list(readJson(text),'Sessions',24).map(session);unique(out,s=>s.id,'session IDs');return out;}
function progress(text){const ids=list(readJson(text),'Progress',Q.length).map(v=>str(v,'Question ID',64)),allowed=new Set(Q.map(q=>q.id));need(ids.every(id=>allowed.has(id))&&new Set(ids).size===ids.length,'Unknown or duplicate practice question ID.');return ids;}
function decode(text){const o=obj(readJson(text),'Backup');need(o.format==='radix-study'&&int(o.version,'Backup version',1,100)===1,'Unsupported backup format/version. Use a Radix study backup version 1.');const saved=list(o.saved,'Saved conversions',50).map(row=>{const x=obj(row,'Saved conversion'),id=int(x.id,'Save ID',1,Number.MAX_SAFE_INTEGER),input=str(x.input,'Saved input',600),base=int(x.base,'Saved base',2,36);need(E.parse(input,base).kind==='valid','A saved conversion is invalid for its source base.');return {id,input,base};});unique(saved,s=>s.id,'conversion IDs');const ss=list(o.sessions,'Sessions',24).map(session);unique(ss,s=>s.id,'session IDs');const pg=progress(JSON.stringify(o.progress));
 const k=obj(o.kmap,'K-map'),n=int(k.variables,'Variables',2,6),cells=list(k.cells,'Cells',64).map(v=>int(v,'Cell',0,2)),form=str(k.form,'Form',3);need(cells.length===(1<<n)&&['SOP','POS'].includes(form),'Invalid K-map dimensions/form.');
 const ex=obj(o.expression,'Expression lab'),expression={variables:int(ex.variables,'Expression variables',2,6),left:str(ex.left,'Expression',256),right:str(ex.right,'Comparison expression',256)};
 const r=obj(o.representation,'Representation lab'),width=int(r.width,'Bit width',4,64),mode=str(r.mode,'Input mode',16);need(widths.includes(width)&&['decimal','bits','gray'].includes(mode),'Invalid representation width/mode.');const representation={width,signed:bool(r.signed,'Signed mode'),mode,input:str(r.input,'Representation input',128)};
 const st=obj(o.settings,'Settings'),settings={haptics:bool(st.haptics,'Haptics'),largeControls:bool(st.largeControls,'Large controls')};
 const c=obj(o.converter,'Converter'),converter={number:str(c.number,'Current number',600),base:int(c.base,'Source base',2,36),custom:c.custom==null?null:int(c.custom,'Custom base',2,36),bits:int(c.bits,'Bit lab value',0,255),dark:bool(c.dark,'Theme')};
 return {saved,sessions:ss,progress:pg,kmap:{variables:n,cells,form},expression,representation,settings,converter};
}
const Backup={readJson,session,sessions,progress,decode,encode:data=>JSON.stringify({format:'radix-study',version:1,appVersion:'7.0.0',...data},null,2)};
const api={Expression,Representation,History,Backup,clone:structClone};if(typeof module!=='undefined'&&module.exports)module.exports=api;if(typeof window!=='undefined')window.RadixStudy=api;
})();
</script>
<script>(() => {
 'use strict';
 window.RadixStudentUI = function({dialog,icon,esc,toast,manualCopy}) {

  sync();
  async function copy(text,message){let ok=false;try{await navigator.clipboard.writeText(text);ok=true;}catch(_){const t=document.createElement('textarea');t.value=text;Object.assign(t.style,{position:'fixed',opacity:'0',width:'1px',height:'1px',top:'0',left:'0'});document.body.appendChild(t);t.select();try{ok=document.execCommand('copy');}catch(_){}t.remove();}if(ok)toast(message);else manualCopy(text);}
  function heading(first,second,eyebrow,subtitle){return `<section class="hero student-hero"><div><p class="eyebrow">${eyebrow}</p><h1>${first}<br><span class="accent">${second}</span></h1><p class="hero-copy">${subtitle}</p></div><div class="student-badge mono">2–6<span>VARIABLES</span></div></section>`;}
  function renderKmap(container){

   <div class="study-history"><button data-student="undo">↶ Undo</button><button data-student="redo">↷ Redo</button></div><div class="kmap-workspace"><section class="kmap-panel">

    <details class="k-inputs"><summary>Edit minterms, maxterms or textbook notation ${icon('down')}</summary><label for="k-notation">Load a Boolean function</label><div class="k-notation-row"><input id="k-notation" class="list-input mono" placeholder="F(A.B.C)=Σm(1,3,5)" autocomplete="off" maxlength="512"><button class="quiet-btn primary" data-student="notation">Load</button></div><div id="k-notation-error" class="k-input-error" role="status"></div><p>List A, B, … in significance order; A is the MSB. You may use Σm for minterms or ΠM for maxterms.</p><label for="k-terms">${s.form==='SOP'?'Minterms Σm (required 1s)':'Maxterms ΠM (required 0s)'}</label><input id="k-terms" class="list-input mono" value="${esc(s.terms)}" placeholder="e.g. 1, 2, 3" inputmode="text" autocomplete="off" maxlength="256"><label for="k-dc">Don't-cares d (optional Xs)</label><input id="k-dc" class="list-input mono" value="${esc(s.dc)}" placeholder="e.g. 0, 4" inputmode="text" autocomplete="off" maxlength="256"><p>Indices 0–${(1<<s.variables)-1}. A is the most significant bit. Duplicates are ignored; ranges are not supported.</p></details>
    <div id="k-input-error" class="k-input-error" role="status"></div>
    <div id="k-answer"></div><div id="k-grid" class="k-grid-wrap"></div>
    <div class="k-map-footer"><span>Tap: 0 → 1 → X → 0</span><button class="quiet-btn" data-student="reset">Reset to 0</button></div>

    <div id="k-manual"></div><div id="k-truth" hidden></div>
   </section><aside class="k-learning"><div id="k-exercise"></div><div id="k-groups"></div><details class="lesson" open><summary><span class="mono">01</span><span class="lesson-title">The five grouping rules</span>${icon('down')}</summary><ol class="rule-list"><li>Use Gray order: 00, 01, 11, 10.</li><li>Group 1, 2, 4, 8, 16, 32 or 64 cells, never 3 or 6.</li><li>Groups are rectangles. No diagonal-only pairs.</li><li>Opposite edges touch. Four corners can make one group.</li><li>Groups may overlap. Xs are optional, not required outputs.</li></ol></details><p class="lesson-tip">SOP: fixed 0 → A', fixed 1 → A.<br>POS: fixed 0 → A, fixed 1 → A'.<br>+ means OR, adjacency means AND, ' means NOT.</p></aside></div>`;
   ['k-terms','k-dc'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{
    const before=snapshot();s.terms=document.getElementById('k-terms').value;s.dc=document.getElementById('k-dc').value;
    const p=K.fromLists(s.variables,s.terms,s.dc,s.form);s.error=p.kind==='invalid'?p.message:null;
    if(p.kind==='valid'){s.cells=p.cells;persist();}s.exercise=null;s.revealed=true;s.selected=[];s.check=null;s.highlight=-1;undo.record(before,snapshot());updateKmap();
   }));updateKmap();
  }
  function updateKmap(){
   document.querySelector('[data-student="undo"]').disabled=!undo.canUndo;document.querySelector('[data-student="redo"]').disabled=!undo.canRedo;
   const solution=s.error?null:K.solve(s.variables,s.cells,s.form),visible=solution&&s.revealed;
   document.getElementById('k-rule').innerHTML=`${s.form==='SOP'?'Group 1s for a sum of products.':'Group 0s for a product of sums.'} Xs may enlarge groups. Switching form keeps the truth table unchanged.`;
   document.getElementById('k-input-error').textContent=s.error?`Fix the lists before solving: ${s.error}`:'';
   document.getElementById('k-answer').innerHTML=!solution?`<div class="k-answer paused">Results paused · invalid input</div>`:!s.revealed?`<div class="k-answer"><span class="section-label">TRY THE GROUPS FIRST</span><button class="solid-btn" data-student="reveal">Reveal worked solution${icon('arrow')}</button></div>`:`<div class="k-answer"><div><span class="section-label">F(${K.names(s.variables).split('').join(', ')}) · ${s.form}</span><div class="k-expression mono" id="k-expression">${esc(solution.expression)}</div></div><button class="icon-btn" data-student="copy-expression" aria-label="Copy simplified expression">${icon('copy')}</button></div><div class="k-answer-meta">${solution.groups.length} ${s.form==='SOP'?'product terms':'sum clauses'} · ${solution.literalCount} literals · exact minimum</div>`;
   const rows=K.gray(K.rowBits(s.variables)),cols=K.gray(K.columnBits(s.variables)),rowLabel=K.names(s.variables).slice(0,K.rowBits(s.variables)),colLabel=K.names(s.variables).slice(K.rowBits(s.variables));
   let grid=`<div class="k-map ${s.variables>=5?'wide':''}" style="--columns:${cols.length}"><div class="k-axis">${rowLabel} / ${colLabel}</div>${cols.map(c=>`<div class="k-col-label mono">${K.binary(c,K.columnBits(s.variables))}</div>`).join('')}`;
   rows.forEach((r,ri)=>{grid+=`<div class="k-row-label mono">${K.binary(r,K.rowBits(s.variables))}</div>`;cols.forEach((_,ci)=>{
    const index=K.cellAt(s.variables,ri,ci),value=s.cells[index],members=visible?solution.groups.map((g,i)=>K.hasCell(g.cube.members,index)?i:null).filter(i=>i!==null&& (s.highlight<0||s.highlight===i)):[];
    const outlines=s.manual?'':members.slice(0,4).map((g,i)=>`<span class="k-outline" style="inset:${2+i*3}px;border-color:${colors[g%colors.length]}" aria-hidden="true"></span>`).join('');
    grid+=`<button class="k-cell ${value===1?'one':value===2?'dc':''} ${s.selected.includes(index)?'chosen':''}" data-student="cell" data-index="${index}" ${s.error?'disabled':''} aria-label="Cell ${index}, ${K.names(s.variables).split('').map((v,i)=>v+'='+K.binary(index,s.variables)[i]).join(', ')}, output ${value===2?'don\'t-care':value}. ${s.manual?'Select group cell.':'Tap to cycle.'}">${outlines}<span class="k-index mono">${index}</span><strong class="mono">${value===2?'X':value}</strong><span class="k-members">${members.length&&!s.manual?members.map(i=>'G'+(i+1)).join(' '):K.binary(index,s.variables)}</span></button>`;
   });});grid+='</div>';document.getElementById('k-grid').innerHTML=grid;
   document.getElementById('manual-label').textContent=s.manual?'Exit group-check mode':'Check your own group';
   document.getElementById('k-manual').innerHTML=s.manual?`<div class="manual-panel"><p>Tap adjacent cells to select a power-of-two group (1–${1<<s.variables} cells). Values do not change in this mode.</p><div><span class="mono">${s.selected.length} selected</span><button class="quiet-btn" data-student="clear-selection">Clear</button><button class="solid-btn" data-student="check-group">Check group</button></div>${s.check?`<p class="group-feedback ${s.check.valid?'valid':'invalid'}" role="status">${esc(s.check.message)}</p>`:''}</div>`:'';
   document.getElementById('k-exercise').innerHTML=s.exercise?`<div class="exercise-hint"><span class="section-label">BEGINNER CHALLENGE · ${s.exercise.variables} VARIABLES</span><h3>${esc(s.exercise.title)}</h3><p>${esc(s.exercise.hint)}</p>${s.revealed?`<p class="exercise-lesson">${esc(s.exercise.lesson)}</p>`:''}</div>`:'';
   document.getElementById('k-groups').innerHTML=!visible?'<div class="group-empty">The worked grouping appears here after the answer is revealed.</div>':`<div class="label-row"><span class="section-label">WHY THIS ANSWER WORKS</span><button class="quiet-btn primary" data-student="copy-kmap" aria-label="Copy all K-map working">${icon('copy')}Copy working</button></div><p class="solution-note">${esc(solution.note)}</p>${solution.groups.length?`<div class="group-filter"><button class="quiet-btn ${s.highlight<0?'primary':''}" data-student="highlight" data-group="-1">All groups</button>${solution.groups.map((g,i)=>`<button class="group-pill ${s.highlight===i?'selected':''}" data-student="highlight" data-group="${i}" style="--group-color:${colors[i%colors.length]}">G${i+1}</button>`).join('')}</div>${solution.groups.map((g,i)=>`<details class="group-detail" ${s.highlight===i?'open':''} style="--group-color:${colors[i%colors.length]}"><summary><span class="group-number">G${i+1}</span><span class="mono">${esc(s.form==='POS'?'('+g.term+')':g.term)}</span>${icon('down')}</summary><p>Cells ${K.indices(g.cube,s.variables).join(', ')} · ${K.bitCount(g.cube.members)} cells${g.wraps?' · wraps across an edge':''}${g.essential?' · essential':''}</p><ul>${g.explanation.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>${g.essential?'At least one required cell has no other maximal covering group.':'Chosen to complete a minimum cover; overlap is allowed.'}</p></details>`).join('')}`:'<div class="group-empty">No required groups are needed for this constant function.</div>'}`;
   if(!document.getElementById('k-truth').hidden)updateTruth(solution);
  }
  function updateTruth(solution){document.getElementById('k-truth').innerHTML=`<table class="student-table"><thead><tr><th>${K.names(s.variables)}</th><th>Index</th><th>Input F</th><th>Simplified F</th></tr></thead><tbody>${s.cells.map((v,i)=>`<tr><td class="mono">${K.binary(i,s.variables)}</td><td>${i}</td><td>${v===2?'X':v}</td><td>${solution&&s.revealed?Number(solution.evaluate(i)):'—'}${v===2&&solution&&s.revealed?' (optional)':''}</td></tr>`).join('')}</tbody></table><p class="precision-note">Only 0/1 cells must match; X cells impose no output requirement.</p>`;}
  function examples(){document.getElementById('dialog-body').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">Little aha moments.</h2><button class="icon-btn" data-action="close-dialog" aria-label="Close examples">${icon('close')}</button></div><p id="dialog-description">24 beginner cases. Try the groups, then reveal the worked solution.</p><div class="example-list">${K.exercises.map((e,i)=>`<button data-student="exercise" data-index="${i}"><span class="example-number mono">${String(i+1).padStart(2,'0')}</span><span><strong>${esc(e.title)}</strong><small>${e.variables} variables · ${e.form}${e.dc.length?' · don\'t-cares':''}</small></span>${icon('arrow')}</button>`).join('')}</div>`;dialog.classList.remove('working-dialog');dialog.scrollTop=0;if(!dialog.open)dialog.showModal();}
  function showWorking(input,from,target=16){active=false;work={input,from};workTarget=target;renderWorking();dialog.classList.add('working-dialog');dialog.scrollTop=0;if(!dialog.open)dialog.showModal();}
  function renderWorking(){
   const r=W(work.input,work.from,workTarget),limited=(items,fn)=>items.length<=24?items.map(fn).join(''):`${items.slice(0,12).map(fn).join('')}<details class="extra-steps"><summary>${items.length-24} middle steps · show all</summary>${items.slice(12,-12).map(fn).join('')}</details>${items.slice(-12).map(fn).join('')}`;
   document.getElementById('dialog-body').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">Don't just get it. Get why.</h2><button class="icon-btn" data-action="close-dialog" aria-label="Close working">${icon('close')}</button></div><p id="dialog-description">${esc(work.input)} in base ${work.from}. Every step uses exact rational arithmetic.</p><div class="work-target"><label for="work-target">Show working to</label><select id="work-target">${Array.from({length:35},(_,i)=>i+2).map(b=>`<option value="${b}" ${b===workTarget?'selected':''}>${E.name(b)} · base ${b}</option>`).join('')}</select><button class="quiet-btn primary" data-student="copy-working">${icon('copy')}Copy working</button></div><div class="work-answer"><span class="section-label">THE ANSWER · BASE ${workTarget}</span><div class="mono">${esc(r.result.display)}</div><small>${r.result.exact?'Exact':'Truncated at 24 fractional places · approximate'}</small></div><section class="work-section"><h3><span>01</span>Expand the place values</h3><p>Read positions from the point: … 2, 1, 0, −1, −2 … . Letters A–Z represent 10–35. Work on the magnitude first.</p><div class="work-lines">${limited(r.places,p=>`<div class="mono">${esc(`${p.digit} (${p.digitValue}) × ${r.from}^${p.exponent} = ${p.d===1n?p.n:p.n+'/'+p.d}`)}</div>`)}</div>${r.repeatFormula?`<p>Repeating tails use a geometric series, not a rounded decimal:</p><div class="work-lines mono">${esc(r.repeatFormula)}</div>`:''}<p><strong>Exact value: <span class="mono">${esc(r.ratio)}</span></strong><br>Decimal: <span class="mono">${esc(E.format(r.value,10).display)}</span></p></section><section class="work-section"><h3><span>02</span>Divide the integer part</h3><p>Keep dividing the quotient by ${workTarget}. Read the remainders <strong>bottom to top</strong>.</p><div class="work-lines">${limited(r.divisions,d=>`<div class="mono">${esc(`${d.dividend} ÷ ${d.base} = ${d.quotient}, remainder ${d.remainder} (${d.digit})`)}</div>`)}</div><p class="mono">Integer digits: ${esc(r.reversedRemainders)}</p></section>${r.multiplications.length?`<section class="work-section"><h3><span>03</span>Multiply the fractional part</h3><p>Multiply each remainder by ${workTarget}. Keep its integer digit; carry the fractional remainder. Read digits <strong>top to bottom</strong>—do not reverse them.</p><div class="work-lines">${r.multiplications.map((m,i)=>`<div class="mono">${esc(`${i+1}. ${m.before}/${m.denominator} × ${m.base} = ${m.digitValue} + ${m.after}/${m.denominator} → ${m.digit}`)}</div>`).join('')}</div><p>${r.cycleStart!==null?`The remainder repeats. The cycle starts at fractional step ${r.cycleStart+1}; those digits belong in parentheses.`:r.remaining?'The remainder has not reached zero or a known cycle after 24 places. The ellipsis marks a truncated approximation.':'Remainder zero: the fraction terminates exactly.'}</p></section>`:''}${r.negative?`<div class="work-warning">Restore the minus sign. Negative binary here is signed magnitude, not fixed-width two's complement.</div>`:''}${r.shortcut.length?`<section class="work-section"><h3>${icon('sparkle')}The bit-grouping shortcut</h3><div class="work-lines">${r.shortcut.map(x=>`<div class="mono">${esc(x)}</div>`).join('')}</div></section>`:''}`;
   document.getElementById('work-target').addEventListener('change',e=>{workTarget=Number(e.target.value);renderWorking();});
  }
  document.addEventListener('click',event=>{
   const button=event.target.closest('button[data-student]');if(!button||button.disabled)return;
   const action=button.dataset.student;
   if(action==='copy-working'){const r=W(work.input,work.from,workTarget);copy(r.text(),'Working copied.');return;}
   if(!active&&action!=='exercise')return;
   const before=['variables','form','reset','exercise','notation'].includes(action)||action==='cell'&&!s.manual?snapshot():null;
   switch(action){
    case 'undo':{const v=undo.undo(snapshot());if(v){apply(v);renderKmap(document.getElementById('content'));}break;}
    case 'redo':{const v=undo.redo(snapshot());if(v){apply(v);renderKmap(document.getElementById('content'));}break;}
    case 'notation':try{const parsed=K.fromNotation(document.getElementById('k-notation').value);if(parsed.names!==K.names(parsed.variables))throw Error('List the map variables in A, B, C… order so the displayed axes match.');Object.assign(s,{variables:parsed.variables,cells:parsed.cells,form:parsed.form,manual:false,selected:[],check:null,highlight:-1,exercise:null,revealed:true,error:null});sync();renderKmap(document.getElementById('content'));toast(parsed.form+' function loaded into K-maps.');}catch(error){document.getElementById('k-notation-error').textContent=error.message;}break;
    case 'variables':s.manual=false;s.variables=Number(button.dataset.n);s.cells=Array(1<<s.variables).fill(0);s.exercise=null;s.revealed=true;s.selected=[];s.check=null;s.highlight=-1;sync();renderKmap(document.getElementById('content'));break;
    case 'form':s.form=button.dataset.form;s.exercise=null;s.revealed=true;s.manual=false;s.highlight=-1;s.selected=[];s.check=null;sync();renderKmap(document.getElementById('content'));break;
    case 'cell':{const i=Number(button.dataset.index);if(s.manual){s.selected=s.selected.includes(i)?s.selected.filter(x=>x!==i):[...s.selected,i];s.check=null;}else{s.cells[i]=(s.cells[i]+1)%3;s.highlight=-1;s.exercise=null;s.revealed=true;sync();document.getElementById('k-terms').value=s.terms;document.getElementById('k-dc').value=s.dc;}updateKmap();break;}
    case 'reset':s.manual=false;s.cells=Array(1<<s.variables).fill(0);s.selected=[];s.check=null;s.exercise=null;s.revealed=true;s.highlight=-1;sync();renderKmap(document.getElementById('content'));break;
    case 'manual':s.manual=!s.manual;s.selected=[];s.check=null;updateKmap();break;
    case 'clear-selection':s.selected=[];s.check=null;updateKmap();break;
    case 'check-group':s.check=K.checkGroup(s.variables,s.cells,s.selected,s.form);updateKmap();break;
    case 'highlight':s.highlight=Number(button.dataset.group);updateKmap();break;
    case 'truth':{const el=document.getElementById('k-truth');el.hidden=!el.hidden;if(!el.hidden)updateTruth(s.error?null:K.solve(s.variables,s.cells,s.form));break;}
    case 'copy-kmap':if(!s.error&&s.revealed){const q=K.solve(s.variables,s.cells,s.form);const text=[`F(${K.names(s.variables)}) = ${q.expression} · ${s.form}`,`Gray order: 00, 01, 11, 10. A is the MSB.`,`Required ${s.form==='SOP'?'1s':'0s'}: ${s.terms}; don't-cares: ${s.dc}`,...q.groups.flatMap((g,i)=>[`G${i+1}: cells ${K.indices(g.cube,s.variables).join(', ')} → ${g.term}${g.wraps?' (edge wrap)':''}`,...g.explanation]),q.note,'Truth table: inputs / F / simplified',...s.cells.map((v,i)=>`${K.binary(i,s.variables)} / ${v===2?'X':v} / ${Number(q.evaluate(i))}${v===2?' (optional)':''}`)].join('\n');copy(text,'K-map working copied.');}break;
    case 'copy-expression':if(!s.error&&s.revealed)copy(K.solve(s.variables,s.cells,s.form).expression,'Simplified expression copied.');break;
    case 'examples':examples();break;
    case 'exercise':{const e=K.exercises[Number(button.dataset.index)];if(!e)return;Object.assign(s,{variables:e.variables,cells:e.cells(),form:e.form,exercise:e,revealed:false,manual:false,selected:[],check:null,highlight:-1});sync();dialog.close();renderKmap(document.getElementById('content'));break;}
    case 'reveal':s.revealed=true;updateKmap();break;
   }if(before){undo.record(before,snapshot());document.querySelector('[data-student="undo"]').disabled=!undo.canUndo;document.querySelector('[data-student="redo"]').disabled=!undo.canRedo;}
  });
  dialog.addEventListener('close',()=>dialog.classList.remove('working-dialog'));
  return {getMap:()=>({variables:s.variables,cells:[...s.cells],form:s.form}),restoreMap:value=>{Object.assign(s,value,{manual:false,selected:[],check:null,highlight:-1,exercise:null,revealed:true});sync();undo.clear();},renderKmap,showWorking,loadTruth:(variables,cells,form='SOP')=>{if(![2,3,4,5,6].includes(variables)||cells.length!==(1<<variables)||cells.some(v=>![0,1].includes(v))||!['SOP','POS'].includes(form))throw Error('Invalid truth table bridge');const before=snapshot();Object.assign(s,{variables,cells:[...cells],form,manual:false,selected:[],check:null,highlight:-1,exercise:null,revealed:true});sync();undo.record(before,snapshot());},deactivate:()=>{active=false;}};
 };
})();
