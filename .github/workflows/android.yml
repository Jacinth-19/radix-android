name: Android compile and test

on:
  push:
    branches:
      - arena/1469181a-radix-android
    paths:
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, unit test, lint and package unsigned APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests, lint and debug/release builds
        run: >-
          ./gradlew --no-daemon --stacktrace
          testDebugUnitTest testReleaseUnitTest
          lintDebug lintRelease
          assembleDebug assembleRelease

      - name: Upload APKs and Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radix-android-${{ github.sha }}
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/tests/testReleaseUnitTest/**
            app/build/reports/lint-results-*.html
