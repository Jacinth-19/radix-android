name: Android compile and test

on:
  push:
    branches:
      - arena/55c0e92a-radix-android
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, unit and emulator test, lint and package unsigned APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android unit tests, lint and debug/release builds
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest testReleaseUnitTest compileDebugAndroidTestKotlin \
            lintDebug lintRelease \
            assembleDebug assembleRelease 2>&1 | tee android-build.log
          gradle_status=${PIPESTATUS[0]}
          if [ "$gradle_status" -ne 0 ]; then
            python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          lines = Path("android-build.log").read_text(errors="replace").splitlines()
          failure_start = max((i for i, line in enumerate(lines) if line.startswith("FAILURE:")), default=-1)
          focus = lines[failure_start:] if failure_start >= 0 else lines[-600:]
          focus = [line for line in focus if line.strip() and not re.match(r"^\s*(at\s+|\.\.\.\s+\d+\s+more$)", line)]
          context = [line for line in lines[-800:] if re.search(r"(^e: |^> Task .*FAILED|failed tests|tests completed, \d+ failed|AssertionError|No matching variant|Could not resolve|Could not find)", line, re.I)]
          test_failures = []
          for report in Path("app/build/test-results").glob("test*/TEST-*.xml"):
              try:
                  root = ET.parse(report).getroot()
              except (ET.ParseError, OSError):
                  continue
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is not None:
                      test_failures.append(f"{root.get('name')}#{case.get('name')}: {failure.get('message', '')}")
          details = "\n".join(test_failures + list(dict.fromkeys(context[-35:] + focus[:60])))[:3200]
          details = details.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Android Gradle failure::{details or 'Gradle exited nonzero; see android-build.log artifact.'}")
          PY
          fi
          exit "$gradle_status"

      - name: Verify native UI on a compact Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          disable-animations: true
          script: |
            # Exercise a compact 320 dp phone in both portrait and landscape.
            adb shell wm size 640x1280
            adb shell wm density 320
            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Summarize hosted-device test results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          roots = [
              Path("app/build/outputs/androidTest-results/connected"),
              Path("app/build/test-results/connectedAndroidTest"),
          ]
          reports = [report for root in roots if root.exists() for report in root.rglob("TEST-*.xml")]
          failures = []
          total = failed = 0
          for report in reports:
              try:
                  suite = ET.parse(report).getroot()
              except (ET.ParseError, OSError):
                  continue
              total += int(suite.get("tests", 0))
              failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
              for case in suite.iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is not None:
                      detail = problem.get("message", "") + chr(10) + (problem.text or "")
                      failures.append(f"{suite.get('name')}#{case.get('name')}: {detail[:2400]}")

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if reports:
              summary.write_text("## Hosted Android UI tests" + chr(10) + chr(10) + f"{total - failed}/{total} passed; {failed} failed." + chr(10))
          else:
              summary.write_text("## Hosted Android UI tests" + chr(10) + chr(10) + "No instrumentation XML report was produced; inspect the emulator step output." + chr(10))
          if failures:
              for failure in failures:
                  encoded = failure.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A")
                  print(f"::error title=Hosted Android UI test failure::{encoded}")
          elif reports:
              print(f"Hosted Android UI tests: {total}/{total} passed.")
          else:
              print("::error title=Hosted Android UI report missing::No instrumentation XML report was produced; check emulator startup and connected-test logs.")
              print("No hosted-device instrumentation XML report found.")
          PY

      - name: Upload APKs and Android reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: radix-android-${{ github.sha }}
          if-no-files-found: warn
          path: |
            android-build.log
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/tests/testReleaseUnitTest/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            app/build/test-results/connectedAndroidTest/**
            app/build/reports/lint-results-*.html

  browser-companion:
    name: Browser engines and companion UI regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-browser.txt

      - name: Run independent engine and asset checks
        run: |
          node tools/test-engine.js
          node tools/test-student-engines.js
          node tools/test-logic-engine.js
          node tools/test-study-engines.js
          python tools/test-notification-assets.py
          python tools/build-preview.py
          node tools/build-workbook.js

      - name: Install Playwright and Chromium
        run: |
          python -m pip install -r tools/requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Run browser companion UI suites
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 3000 --bind 127.0.0.1 --directory web > "$RUNNER_TEMP/radix-web-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null
          python tools/test-ui.py
          python tools/test-student-ui.py
          python tools/test-logic-ui.py
          python tools/test-study-ui.py

      - name: Upload companion test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: radix-browser-tests-${{ github.sha }}
          if-no-files-found: warn
          path: |
            design/logic-engine-results.json
            design/student-engine-results.json
            design/study-engine-results.json
            design/browser-test-results.json
            design/student-ui-results.json
            design/logic-ui-results.json
            design/study-ux-checks.json
            ${{ runner.temp }}/radix-web-server.log

  release-v7:
    name: Sign and publish v7.0.0
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/arena/1469181a-radix-android' &&
      startsWith(github.event.head_commit.message, 'release: v7.0.0')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Verify source release version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 7' app/build.gradle.kts
          grep -Fq 'versionName = "7.0.0"' app/build.gradle.kts
          if gh release view v7.0.0 >/dev/null 2>&1; then
            echo 'GitHub release v7.0.0 already exists; refusing to replace it.' >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Assemble release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Sign release APK with protected key
        shell: bash
        env:
          RADIX_RELEASE_P12_BASE64: ${{ secrets.RADIX_RELEASE_P12_BASE64 }}
          RADIX_RELEASE_P12_PASSWORD: ${{ secrets.RADIX_RELEASE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RADIX_RELEASE_P12_BASE64" || -z "$RADIX_RELEASE_P12_PASSWORD" ]]; then
            echo 'Missing repository Actions secrets for release signing.' >&2
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/Radix-release.p12"
          password_file="$RUNNER_TEMP/Radix-release.password"
          trap 'rm -f "$key" "$password_file"' EXIT
          printf '%s' "$RADIX_RELEASE_P12_BASE64" | base64 --decode > "$key"
          printf '%s' "$RADIX_RELEASE_P12_PASSWORD" > "$password_file"
          test -s "$key"
          bash tools/sign-release.sh "$key" "$password_file" "$RUNNER_TEMP/Radix-release.apk"

      - name: Verify release signing identity and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/Radix-release.apk"
          verify_output="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verify_output"
          actual="$(printf '%s\n' "$verify_output" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')"
          expected='785b9e3334078ed72a2a106e5dad849d80597d1dac929ce40f840671ca639020'
          if [[ "$actual" != "$expected" ]]; then
            echo 'The APK certificate does not match the established v6 release identity.' >&2
            exit 1
          fi
          sha256sum "$apk" | awk '{print $1 "  Radix-release.apk"}' > "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Write release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## What's new in 7.0.0

          - Complete French, Spanish, and Portuguese localization across native app screens, generated teaching text, catalog copy, accessibility descriptions, and share cards.
          - Offline-first behavior remains unchanged; the browser companion remains English-only.

          ## Install

          Download `Radix-release.apk` below on your Android device, open it, and allow installation when prompted. This release is signed with the established Radix release certificate for in-place upgrades.

          Android CI tests, lint, and debug/release assembly passed. Device installation and device QA are not claimed.
          EOF

      - name: Publish v7.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v7.0.0 \
            "$RUNNER_TEMP/Radix-release.apk" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title 'Radix 7.0.0' \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
